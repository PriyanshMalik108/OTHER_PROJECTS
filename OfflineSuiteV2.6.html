  'img-watermark': { what: 'Overlays text across an image, similar to the PDF watermark tool.', steps: ['Upload the image(s).', 'Type your watermark text and adjust position/opacity.', 'Click "Apply" to download.'], avoid: ['Burned into the pixels — there\u2019s no way to remove it from the output afterward.'] },
  'img-adjust': { what: 'Basic brightness and contrast adjustment.', steps: ['Upload the image(s).', 'Set brightness/contrast percentages (100% = unchanged).', 'Click "Run" to download the adjusted image.'], avoid: ['This is basic tone adjustment, not full color grading — no curves, selective color, or shadow/highlight controls.'] },
  'img-bg-remove': { what: 'Removes the background from an image using flood-fill, best suited to plain/solid-color backgrounds.', steps: ['Upload the image(s).', 'Adjust "Color tolerance" if needed — the background color is auto-sampled from the image\u2019s four corners, no clicking required.', 'Click "Run" to download transparent PNGs.'], avoid: ['This is not AI-based subject detection — busy, textured, or multi-color backgrounds (like real photo backdrops) won\u2019t remove cleanly. It works best on flat studio-style or solid-color backgrounds.'], notes: [
    'How it decides what\u2019s "background": it averages the color of the four corner pixels, then flood-fills inward from every edge of the image, clearing any pixel connected to the edge whose color is within the tolerance of that sampled corner color. It never looks at the center of the image, only what\u2019s reachable from the edges — so a subject that touches the edge of the frame can get partially erased too.',
    'Best-case input: a product or portrait shot on an even, solid-colored backdrop (studio white, seamless paper, flat wall) with the subject fully inside the frame and not touching the edges.',
    'Tolerance tuning: raise "Color tolerance" if the background has slight shading/gradient and isn\u2019t clearing fully; lower it if the removal is eating into the subject\u2019s edges (common with light-colored clothing/hair against a light background).',
    'Not a substitute for AI segmentation: textured backgrounds, photo backdrops, or busy real-world scenes will only partially clear, since there\u2019s no understanding of "subject vs. background" beyond color proximity to the corners.',
    'Output is always PNG (to support transparency) regardless of the input format — expect a larger file than the original JPEG for photos.',
  ] },
  'img-exif': { what: 'Reads and displays a JPEG\u2019s embedded EXIF metadata — camera make/model, exposure settings, date taken, and GPS location if present.', steps: ['Upload the image.', 'Review the metadata fields shown.'], avoid: ['Not every image has EXIF data — screenshots, edited exports, and many web-downloaded images strip it already, so an empty result is often expected, not a bug.'], notes: [
    'What it decodes: camera make and model, orientation, exposure time, f-number, ISO, focal length, the date the photo was taken, and — if present — GPS latitude/longitude, converted to plain decimal coordinates for easy lookup on a map.',
    'JPEG only: EXIF is a JPEG-specific metadata format, so this only works on .jpg/.jpeg files — PNG, WEBP, and other formats don\u2019t use EXIF and will show no data even if they carry other kinds of metadata.',
    'A blank/missing field is often correct, not a failure: many cameras and virtually all screenshot tools omit GPS by default, and social media / messaging apps commonly strip EXIF entirely on upload to protect user privacy — so seeing few or no fields doesn\u2019t mean the tool failed to read the file.',
    'Privacy note: if this shows a GPS location, that means the exact coordinates where the photo was taken are embedded in the file — anyone you send the original file to (not a screenshot of it) can extract that same location. Run "Remove metadata" first if you want to share the photo without exposing where it was taken.',
  ] },
  'img-favicon': { what: 'Generates a full set of favicon sizes from one source image, for use on a website.', steps: ['Upload a square (or near-square) source image, ideally 512×512 or larger.', 'Click "Generate" to download the favicon set.'], avoid: ['Starting from a low-resolution or non-square image will produce a blurry or oddly-cropped favicon set.'] },
  'img-gif': { what: 'Combines a sequence of images into an animated GIF.', steps: ['Upload the images in the order they should play.', 'Set frame delay/timing.', 'Click "Create GIF" to download.'], avoid: ['GIFs don\u2019t support smooth gradients well and can look banded — expect some quality loss versus the source images.'] },
  'img-upscale': { what: 'Enlarges an image using multi-pass smoothed interpolation, sharper than a plain resize-up.', steps: ['Upload the image.', 'Pick the target scale (e.g. 2x, 4x).', 'Click "Upscale" to download.'], avoid: ['This smooths and interpolates existing pixels — it doesn\u2019t invent genuine new detail the way AI super-resolution tools do, so don\u2019t expect miracles on very low-resolution sources.'], notes: [
    'How it differs from a plain resize: instead of stretching the image in one jump, it steps up in repeated ~1.5× passes with high-quality smoothing at each step. This meaningfully reduces the blocky/pixelated look of a single large resize, but it is still fundamentally interpolation — it fills in new pixels by blending nearby existing ones, it does not synthesize genuinely new detail the way a neural super-resolution model would.',
    'Best results: moderate scale factors (2×–3×) on images that are already reasonably sharp. A very blurry or heavily compressed (JPEG-artifact-heavy) source will upscale into a larger but still blurry/artifacted image — this tool can\u2019t remove flaws that are already baked into the source.',
    'Output is always PNG, so file sizes at 4× on a large source photo can get sizable — expect noticeably longer processing and larger downloads than the original.',
  ] },

  'ocr-image': { what: 'Recognizes and extracts text from a photo or scanned image, on-device.', steps: ['Upload the image.', 'Pick the text\u2019s language for best accuracy.', 'Click "Extract text" and wait for recognition to finish.'], avoid: ['Blurry photos, low contrast, or unusual fonts reduce accuracy noticeably.', 'The first run downloads the recognition engine and language data — it needs an internet connection the first time it\u2019s used.'], notes: [
    'Best photo conditions: sharp focus (not motion-blurred), even lighting with no glare, high contrast between text and background, and the text roughly horizontal — a phone photo taken straight-on beats an angled one every time.',
    'Language matters: pick the language that matches the text in the image, not your own preferred language — mismatched language data measurably lowers accuracy even on an otherwise clean, sharp photo.',
    'Font sensitivity: this is tuned for standard printed/typed fonts. Highly decorative, script, or handwritten text will recognize much less reliably — treat output from stylized text as a rough draft to proofread, not a verbatim transcript.',
    'First use needs a connection: the OCR engine and language data download from the network the first time this tool runs in a session; once loaded, it works fully on-device without re-uploading your image anywhere.',
  ] },
  'ocr-pdf': { what: 'Runs OCR across every page of a scanned PDF to extract its text.', steps: ['Upload the scanned PDF.', 'Pick the document language.', 'Click "Run" — long documents take longer since every page is processed.'], avoid: ['This produces plain text, not a searchable PDF — use "OCR PDF" in the PDF Workspace if you want the PDF itself to become searchable.'] },
  'ocr-table': { what: 'Detects tabular data in an image and exports it as structured rows/columns.', steps: ['Upload an image containing a clear table.', 'Click "Extract" and review the detected rows/columns.', 'Download as CSV.'], avoid: ['Works best on clean, gridded tables — tables with merged cells, no visible borders, or heavy skew are harder to detect correctly. Always double check the output before relying on it.'], notes: [
    'How detection works: it runs OCR to find every word\u2019s text and its (x, y) position on the page, then clusters those positions into rows and columns by proximity — it isn\u2019t reading visible grid lines, so a table drawn without borders can still work if spacing between cells is consistent.',
    'What trips it up: merged/spanning cells, columns with wildly inconsistent widths, rotated or skewed photos, and multi-line text inside a single cell are the most common causes of a row splitting oddly or a column merging incorrectly.',
    'Best source: a straight-on scan or photo (not an angled phone shot), even lighting, and reasonably consistent spacing between columns.',
    'Always spot-check the CSV against the original image before using it — a misclustered cell can silently shift an entire row\u2019s values over by one column.',
  ] },
  'ocr-invoice': { what: 'Reads a photo or scan of an invoice and pulls out vendor, date, invoice number, subtotal, tax, and total.', steps: ['Upload the invoice image.', 'Click "Extract" and review the fields found.'], avoid: ['Extraction is pattern-based, not a true understanding of every invoice layout — always verify amounts before using them for anything financial.'], notes: [
    'Fields extracted: vendor name, date, invoice number, subtotal, tax, and total — it does not itemize individual line items/products, only these summary-level fields.',
    'How it finds them: it OCRs the full document, then applies pattern matching (currency-like numbers, labels such as "Total"/"Subtotal"/"Invoice #") to guess which text belongs to which field — it isn\u2019t a layout-aware AI model trained on invoice templates, so unusual layouts or non-English labels can cause a field to come back blank or mismatched.',
    'Always verify before use: because amounts feed into real financial decisions, treat every extracted number as a draft to confirm against the original image, not a final source of truth — especially subtotal vs. total, which is the field pair most likely to be swapped on unusual layouts.',
  ] },
  'ocr-receipt': { what: 'Reads a photo of a receipt and pulls out merchant, date, and total.', steps: ['Upload the receipt image.', 'Click "Extract" and review the results.'], avoid: ['Faded thermal-paper receipts and crumpled photos reduce accuracy — flatten and get good lighting before photographing.'], notes: [
    'Best photo conditions: flatten the receipt fully (crumpled paper distorts text), use bright even lighting with no glare, and fill the frame with just the receipt rather than a wide shot from a distance.',
    'Thermal paper fades over time — a receipt photographed weeks after printing often has visibly lighter ink, which measurably lowers OCR accuracy; photograph receipts you need to keep as soon as practical.',
    'This extracts merchant, date, and total only — it does not itemize individual purchased items, so use "Extract text" (OCR) instead if you need every line.',
  ] },
  'ocr-business-card': { what: 'Reads a photo of a business card and extracts name, title, company, phone, email, and website.', steps: ['Upload the card image.', 'Click "Extract" and review the fields.'], avoid: ['Unusual or highly stylized card designs (logos as text, script fonts) are harder to read accurately.'], notes: [
    'Fields extracted: name, job title, company, phone, email, and website — all six are attempted, though not every card includes all of them, so a blank field is often correct rather than a miss.',
    'What reduces accuracy: logos rendered as stylized/script text (rather than a plain printed font), very small print, glossy card stock causing glare in the photo, and multi-language cards where fields aren\u2019t in a predictable position.',
    'Photograph flat and square-on with even lighting for the best read — an angled or curled card (common with photos taken by hand) distorts character shapes and hurts recognition noticeably.',
  ] },

  'word-pdf': { what: 'Two-way converter between Word documents and PDF.', steps: ['Pick the direction (Word → PDF or PDF → Word).', 'Upload your file.', 'Click convert and download the result.'], avoid: ['See the dedicated "Word → PDF" and "PDF → Word" guides for format-specific notes — both directions have real limitations worth knowing about.'] },
  'excel-pdf': { what: 'Converts a spreadsheet into a formatted, print-ready PDF.', steps: ['Upload the .xlsx file.', 'Click "Convert" to download the PDF.'], avoid: ['Very wide sheets may get split or shrunk to fit the page — check the output for readability on data-heavy sheets.'] },
  'excel-csv': { what: 'Two-way conversion between Excel spreadsheets and CSV.', steps: ['Upload your .xlsx or .csv file.', 'Click "Convert" to download.'], avoid: ['CSV has no concept of multiple sheets, formulas, or formatting — converting to CSV keeps values only, from one sheet.'] },
  'excel-json': { what: 'Two-way conversion between Excel spreadsheets and JSON.', steps: ['Upload your .xlsx or .json file.', 'Click "Convert" to download.'], avoid: ['Each row becomes one JSON object using the header row as keys — irregular headers can produce awkward key names.'] },
  'ppt-pdf': { what: 'Converts PowerPoint slides to PDF, or a PDF back into a basic slide-per-page presentation.', steps: ['Upload the .pptx or .pdf file.', 'Click "Convert" to download.'], avoid: ['Animations, transitions, and embedded video/audio in the original presentation don\u2019t carry over — output is static.'] },
  'ppt-images': { what: 'Exports every slide of a presentation as a separate image.', steps: ['Upload the .pptx file.', 'Click "Convert" — download slides individually or as a ZIP.'], avoid: ['Speaker notes are not included in the exported images.'] },
  'excel-dedupe': { what: 'Scans a spreadsheet for fully duplicate rows and flags them.', steps: ['Upload the .xlsx file.', 'Review the duplicates found.', 'Download the cleaned file with duplicates removed.'], avoid: ['Only exact full-row duplicates are detected — near-duplicates (e.g. differing by one field) won\u2019t be flagged.'] },
  'excel-clean': { what: 'Cleans common spreadsheet messiness: trims stray whitespace, clears blank-looking placeholder text, and fixes numbers stored as text.', steps: ['Upload the .xlsx file.', 'Click "Clean" and review how many cells changed.', 'Download the cleaned file.'], avoid: ['This fixes formatting-level issues, not data correctness — it won\u2019t catch typos or wrong values.'] },
  'word-merge': { what: 'Combines several .docx files into one document, in order.', steps: ['Upload the documents in the order you want them joined.', 'Reorder if needed.', 'Click "Merge" to download.'], avoid: ['Each source document\u2019s own styling is kept as-is — expect visible seams if the documents use very different fonts/formatting.'] },
  'word-readability': { what: 'Scores a document\u2019s reading difficulty using Flesch–Kincaid and related formulas.', steps: ['Upload the .docx file, or paste text directly if offered.', 'Review the readability scores and grade-level estimate.'], avoid: ['These formulas measure sentence/word length patterns, not actual clarity or correctness — treat the score as a rough guide, not a verdict.'] },

  'text-counter': { what: 'Live word count, character count, and estimated reading time as you type.', steps: ['Paste or type your text.', 'Counts update automatically — no button needed.'], avoid: [] },
  'text-case': { what: 'Converts text between UPPERCASE, lowercase, Title Case, and Sentence case.', steps: ['Paste your text.', 'Click the case style you want — the result is ready to copy immediately.'], avoid: ['Title Case here follows simple word-capitalization rules, not full editorial style-guide exceptions (e.g. "a", "the", "of").'] },
  'text-dedupe-sort': { what: 'Removes duplicate lines and/or sorts lines alphabetically.', steps: ['Paste your list, one item per line.', 'Click "Remove duplicates" and/or "Sort A→Z"/"Sort Z→A".'], avoid: ['Duplicate detection is exact and case-sensitive — "Apple" and "apple" are treated as different lines.'] },
  'text-diff': { what: 'Compares two blocks of text and highlights what was added, removed, or changed.', steps: ['Paste the "before" text on one side and "after" text on the other.', 'Review the highlighted differences.'], avoid: ['Best for moderate-length text — extremely large documents can be slow and harder to read as a diff.'], notes: [
    'Real line alignment: this uses a longest-common-subsequence comparison, the same underlying approach as `git diff` or `diff -u` — it finds where lines genuinely match even after lines have been inserted or removed elsewhere, rather than comparing line 1 to line 1, line 2 to line 2, and so on regardless of what shifted. That means inserting one new line near the top correctly shows as one addition, not as every subsequent line falsely appearing changed.',
    'Line-level, not character-level: a single word changed inside a long line will show that whole line as removed-and-re-added rather than just highlighting the changed word within it.',
    'Very large input: on extremely large pasted text, the tool automatically falls back to a simpler side-by-side line comparison to keep the browser responsive, with a warning shown when that happens — normal-sized documents always get the full comparison.',
  ] },
  'text-markdown': { what: 'Live-renders Markdown as formatted preview while you type.', steps: ['Type or paste Markdown.', 'The rendered preview updates automatically.'], avoid: ['Supports the common syntax (headings, bold/italic, links, lists) — advanced extensions like tables or footnotes may not render.'] },
  'text-find-replace': { what: 'Finds and replaces text, with optional regular-expression support.', steps: ['Paste your text.', 'Enter what to find and what to replace it with (check "regex" for pattern matching).', 'Click "Replace" — copy the result.'], avoid: ['With regex enabled, special characters ( . * + ? etc.) are treated as pattern syntax, not literal text — escape them if you mean them literally.'] },

  'dev-json': { what: 'Pretty-prints and validates JSON, catching syntax errors.', steps: ['Paste JSON.', 'Click "Format & validate" to pretty-print it, or "Minify" to compact it.'], avoid: ['Trailing commas and single-quoted keys/strings are invalid JSON and will be flagged, even though some languages tolerate them.'], notes: [
    'Strict JSON only: this validates against the actual JSON specification, which is stricter than what many programming languages tolerate. Trailing commas, single-quoted strings/keys, unquoted keys, and comments are all common in JavaScript object literals but are invalid JSON — pasting a JS object literal instead of real JSON will often show an error even though it looks fine in code.',
    'Error messages point at the problem: the validation error includes the parser\u2019s own message (often with a position), which usually names the exact character/line where parsing broke — start there rather than re-reading the whole input from the top.',
    '"Format & validate" pretty-prints with 2-space indentation for readability; "Minify" strips all whitespace to produce the smallest possible valid JSON, useful when pasting into places with a size limit.',
  ] },
  'dev-base64': { what: 'Encodes text or files to Base64, or decodes Base64 back to its original form.', steps: ['Paste text (or upload a file) and choose Encode or Decode.'], avoid: ['Decoding text that isn\u2019t valid Base64 will fail — make sure you\u2019re decoding, not encoding, when pasting an existing Base64 string.'], notes: [
    'Text encoding: input is read as UTF-8 before encoding, so accented letters, emoji, and non-Latin scripts round-trip correctly — not every online Base64 tool handles this properly, but this one does.',
    'File mode: uploading a file encodes its raw bytes, not its filename or type — the output is just the Base64 string of the file\u2019s contents, shown in the text box for you to copy.',
    'Not encryption: Base64 is a reversible encoding, not a security measure — anyone can decode it back instantly. Don\u2019t use it to "hide" sensitive data; use "AES file encryption" for that.',
  ] },
  'dev-jwt': { what: 'Decodes a JWT\u2019s header and payload so you can inspect its contents.', steps: ['Paste the JWT.', 'Header and payload decode automatically.'], avoid: ['This only decodes and displays the token — it does not verify the signature, so it can\u2019t tell you if the token is genuinely valid/untampered.'], notes: [
    'No signature check: a JWT is three Base64URL segments (header.payload.signature). This tool only decodes the first two — it never checks the signature against a secret/public key, so a token can display perfectly readable, "valid-looking" JSON even if it\u2019s been tampered with or expired. Never treat a successful decode here as proof the token is trustworthy.',
    'Where this is safe to use: debugging your own app during development, inspecting claims (like "exp" or "role") in a token you already trust the source of. Where it isn\u2019t: pasting a production token from a live session — the payload is fully readable to anyone with the string, including you here, so treat any real token as sensitive.',
    '"exp"/"iat" fields are Unix timestamps, not human dates — cross-check them in "Timestamp converter" if you need to confirm expiry at a glance.',
  ] },
  'dev-regex': { what: 'Tests a regular expression against sample text with live match highlighting.', steps: ['Enter a pattern and flags (e.g. "gi").', 'Paste test text — matches highlight automatically.'], avoid: ['JavaScript regex syntax is used — a pattern written for another language (e.g. Python) may behave slightly differently here.'], notes: [
    'Engine: this runs JavaScript\u2019s native RegExp engine. Most patterns are portable, but things like named groups, lookbehind support, and Unicode property escapes (\\p{...}, needs the "u" flag) can behave slightly differently than in Python\u2019s "re" or PCRE — if a pattern that worked elsewhere doesn\u2019t match here, check flag compatibility first.',
    'The "g" (global) flag is force-added automatically so every match highlights, not just the first — you don\u2019t need to type it yourself, though it won\u2019t hurt to.',
    'An invalid pattern (unbalanced parentheses, bad escape) shows the JavaScript engine\u2019s own error message inline rather than failing silently — read that message, it usually points at the exact issue.',
    'Very broad patterns (e.g. `.*` with large input) can highlight the entire text as one match — narrow the pattern if the highlight doesn\u2019t look useful.',
  ] },
  'dev-hash': { what: 'Generates SHA-1, SHA-256, and SHA-512 hashes of text.', steps: ['Type or paste text.', 'Hashes update automatically below.'], avoid: ['MD5 isn\u2019t offered — modern browsers\u2019 built-in crypto no longer supports it, and it\u2019s cryptographically broken besides.'], notes: [
    'Generated via the browser\u2019s native Web Crypto API (not a custom implementation), so the digests match what any standard library (OpenSSL, Python\u2019s hashlib, etc.) would produce for the same exact input bytes.',
    'Exact input matters: hashing is byte-sensitive — a trailing space, extra newline, or different text encoding produces a completely different hash. If you\u2019re trying to match a hash from another source, make sure the input text is truly identical, including invisible whitespace.',
    'SHA-1 is included for compatibility/legacy checks only — it\u2019s no longer considered collision-resistant for security purposes. Prefer SHA-256 or SHA-512 when the hash needs to be tamper-evident.',
    'This hashes the text in the box, not a file — for verifying a downloaded file\u2019s integrity, use "File checksum" in File Management instead.',
  ] },
  'dev-uuid': { what: 'Generates random v4 UUIDs in bulk.', steps: ['Set how many you need.', 'Click "Generate" and copy the results.'], avoid: [], notes: [
    'These are version 4 (random) UUIDs generated via the browser\u2019s cryptographically secure random number generator — suitable as unique IDs in databases, filenames, or API keys, not just for display.',
    'Each click regenerates the whole list fresh — there\u2019s no history kept, so copy the ones you need before generating a new batch.',
  ] },
  'dev-qr': { what: 'Turns text or a URL into a scannable QR code image.', steps: ['Type your text or URL.', 'The QR code renders automatically — download it as PNG.'], avoid: ['Very long text produces a denser, harder-to-scan code — keep it short (a URL, not a paragraph) for reliable scanning.'], notes: [
    'Capacity: supports up to roughly 84 characters of byte-mode data (QR versions 1–5, error-correction level M). Longer input either gets rejected or produces a very dense, hard-to-scan pattern — shorten URLs (a link shortener helps) if you\u2019re near the limit.',
    'Before sharing/printing: scan the generated code yourself with a phone camera first, especially for anything going to print — print size, paper glare, and ink quality all affect real-world scannability more than the code\u2019s own density.',
    'This runs a self-contained encoder with no external service call, so it works fully offline — but that also means it cannot generate custom-branded QR styles (logos in the center, colored modules); output is a standard black-and-white code.',
  ] },
  'dev-timestamp': { what: 'Converts between Unix timestamps and human-readable dates.', steps: ['Enter a Unix timestamp, or click "Use current time".', 'The human-readable equivalent shows automatically, and vice versa.'], avoid: ['Double check seconds vs. milliseconds — a timestamp in milliseconds will otherwise parse as a date far in the future.'], notes: [
    'Seconds vs. milliseconds: this field expects Unix time in seconds (the classic Unix epoch format). Many APIs (including JavaScript\u2019s own Date.now()) return milliseconds instead — if you paste a millisecond value here directly, the date shown will be wildly in the future. Divide by 1000 first if your source is in milliseconds.',
    'Time zone: the human-readable output is rendered in your browser\u2019s local time zone, not UTC — if you need UTC specifically for logs or coordination across regions, account for your local offset when reading the result.',
    'The date picker field works the same way in reverse: it reads whatever local date/time you set and converts it to the matching Unix seconds value.',
  ] },
  'dev-color': { what: 'Converts a color between HEX, RGB, and HSL formats.', steps: ['Pick a color using the picker.', 'All three formats update automatically.'], avoid: [], notes: [
    'Input method: this uses your browser/OS\u2019s native color picker (a swatch grid or wheel), not a text field — there\u2019s no way to type a HEX/RGB/HSL value directly in and have it parsed; you select visually and read the three equivalent values back out.',
    'No alpha/transparency: the picker only produces fully opaque colors — HEX output is always 6 digits (RRGGBB), never an 8-digit RGBA hex, and RGB/HSL values shown don\u2019t include an alpha channel.',
    'Precision: HSL values are rounded to whole degrees/percent for readability. If you need the color to round-trip pixel-exactly into design software, use the HEX value as the source of truth since it\u2019s the most precise of the three.',
    'Copying: the values are shown as plain text in the panel — select and copy them manually (there\u2019s no one-click "copy" button per value), or triple-click a line to select it quickly.',
  ] },

  'file-zip': { what: 'Creates a ZIP archive from multiple files, or extracts files from an existing ZIP.', steps: ['Upload the files to archive (or a .zip to extract).', 'Click "Create ZIP" or "Extract ZIP".'], avoid: ['Password-protected ZIP files can\u2019t be extracted here — only unprotected archives are supported.'] },
  'file-checksum': { what: 'Computes a SHA-256 checksum for a file, useful for verifying it wasn\u2019t corrupted or tampered with.', steps: ['Upload the file.', 'The checksum displays automatically — compare it against a known-good value.'], avoid: [], notes: [
    'What a checksum proves: SHA-256 produces a fixed-length fingerprint of a file\u2019s exact bytes. If even a single byte differs — from corruption during transfer, an incomplete download, or tampering — the checksum comes out completely different, not just slightly off.',
    'How to actually use it: compare the value shown here against a checksum published by the file\u2019s original source (e.g. a software download page often lists a "SHA-256" value next to the file). If they match exactly, the file is byte-for-byte identical to what was published; if not, don\u2019t trust or run the file.',
    'This runs entirely on-device via the browser\u2019s native Web Crypto API, so the file itself is never uploaded anywhere just to compute its checksum.',
  ] },
  'file-rename': { what: 'Renames many files at once using a pattern like "file_{n}.{ext}".', steps: ['Upload the files.', 'Set a naming pattern and starting number.', 'Click "Rename" — download individually or as a ZIP.'], avoid: [] },

  'sec-encrypt': { what: 'Encrypts or decrypts any file with a password, using AES-256-GCM.', steps: ['Choose Encrypt or Decrypt.', 'Select your file — it stays selected once chosen.', 'Enter the password, then click the action button to run.'], avoid: ['There is no password recovery — losing the password means losing the file, permanently.', 'The password must match exactly to decrypt; even one character off will fail.'], notes: [
    'How it works: your password is stretched into a real 256-bit encryption key using PBKDF2 with 250,000 iterations and a random 16-byte salt (a deliberately slow key-derivation step that makes brute-forcing the password far harder than using it directly). The file is then encrypted with AES-256-GCM, an authenticated cipher — meaning decryption doesn\u2019t just fail silently on a wrong password or a tampered file, it explicitly detects and rejects it.',
    'Everything happens on-device: the file, password, and derived key never leave your browser — nothing is uploaded anywhere during encryption or decryption.',
    'Output format: encrypting produces a single `.enc` file containing the salt, IV, original filename, and ciphertext bundled together. You only need this one file (plus the password) to decrypt later — there\u2019s no separate key file to lose.',
    'Password strength matters here: AES-256 itself is effectively unbreakable by brute force, but the real-world weak point is a guessable password. Use "Password generator" first for anything genuinely sensitive, and store that password in a real password manager, not just memory.',
    'Order of operations: you can select the file and type the password in either order — the file stays staged until you click the action button, so there\u2019s no risk of it running prematurely with an empty password field.',
  ] },
  'sec-password-gen': { what: 'Generates strong, random passwords.', steps: ['Set the desired length and character types.', 'Click "Generate" and copy the result.'], avoid: ['Store generated passwords in a real password manager — this tool doesn\u2019t save them anywhere for you.'], notes: [
    'Randomness source: passwords are built from the browser\u2019s cryptographically secure random number generator (not Math.random()), so they\u2019re suitable for real account security, not just placeholders.',
    'Character set: ambiguous-looking characters (like 0/O, 1/l/I) are deliberately excluded from the letter/digit sets to avoid transcription mistakes when typing a password by hand — this is a readability choice, not a security weakness.',
    'Length vs. character variety: for most modern accounts, length matters more than symbol complexity — a 20-character password using all four sets (the default) is very strong; if a site has a low max-length limit, prioritize keeping all character types on over maxing out length.',
    'Nothing is saved: this tool holds the generated password only in the page — closing or refreshing the tab loses it permanently unless you\u2019ve already copied it somewhere safe.',
  ] },
  'sec-password-strength': { what: 'Scores a password\u2019s strength based on entropy (length and character variety).', steps: ['Type a password.', 'The strength score and estimated entropy update as you type.'], avoid: ['A high score means the password is hard to brute-force blindly — it can\u2019t detect if the exact password is a known, previously-leaked one.'], notes: [

function renderToolGuide(toolId) {
  const g = TOOL_GUIDES[toolId];
  if (!g) return '';
  const stepsHtml = (g.steps || []).map((s) => `<li>${escapeHtmlTop(s)}</li>`).join('');
  const avoidHtml = (g.avoid || []).map((s) => `<li>${escapeHtmlTop(s)}</li>`).join('');
  const notesHtml = (g.notes || []).map((s) => `<li>${boldLead(escapeHtmlTop(s))}</li>`).join('');
  return `<details class="tool-guide">
    <summary><span class="guide-icon">${icon('info')}</span>How to use this tool<span class="chev">${icon('chevronDown')}</span></summary>
    <div class="tool-guide-body">
      <p class="tool-guide-what">${escapeHtmlTop(g.what)}</p>
      <div class="tool-guide-cols">
        <div class="tool-guide-col"><h4>Steps</h4><ol>${stepsHtml || '<li>Just start using the controls below.</li>'}</ol></div>
        ${avoidHtml ? `<div class="tool-guide-col avoid"><h4>Know before you start</h4><ul>${avoidHtml}</ul></div>` : ''}
      </div>
      ${notesHtml ? `<div class="tool-guide-notes"><h4>Detailed notes</h4><ul>${notesHtml}</ul></div>` : ''}
    </div>
  </details>`;
}
// Turns a leading "Label:" in a guide note into a bolded lead-in, e.g.
// "Encryption: uses AES-256-GCM" -> "<strong>Encryption:</strong> uses AES-256-GCM"
function boldLead(s) {
  return s.replace(/^([A-Za-z0-9 /&()'-]{2,32}:)\s/, '<strong>$1</strong> ');
}

const MODULE_ROUTERS = {
  pdf: renderPdfTool,
  image: renderImageTool,
  ocr: renderOcrTool,
  office: renderOfficeTool,
  text: (c, id) => renderTextTool(c, id),
  dev: (c, id) => renderDevTool(c, id),
  file: (c, id) => renderFileTool(c, id),
  security: (c, id) => renderSecurityTool(c, id),
  enterprise: renderEnterpriseTool,
};

async function boot() {
  const savedTheme = await DB.get('theme', 'light');
  document.documentElement.setAttribute('data-theme', savedTheme);
  const savedReduceMotion = await DB.get('reduceMotion', null);
  if (savedReduceMotion !== null) document.documentElement.setAttribute('data-reduce-motion', String(savedReduceMotion));

  const app = document.getElementById('app');
  app.innerHTML = `
    <a href="#main" class="skip-link">Skip to main content</a>
    <div class="app-shell">
      <nav class="sidebar" id="sidebar" aria-label="Tool navigation"></nav>
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
      <header class="topbar">
        <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Toggle menu">${icon('menu')}</button>
        <button class="search-trigger" id="searchTrigger"><span style="width:15px">${icon('search')}</span><span>Search tools…</span><kbd>Ctrl K</kbd></button>
        <div class="topbar-spacer"></div>
        <button class="icon-btn" id="themeToggle" aria-label="Toggle theme"></button>
        <button class="icon-btn" id="settingsBtn" aria-label="Settings">${icon('settings')}</button>
      </header>
      <main class="main" id="main" tabindex="-1"></main>
    </div>`;

  const main = document.getElementById('main');
  const sidebar = document.getElementById('sidebar');
  const sidebarBackdrop = document.getElementById('sidebarBackdrop');
  const themeToggle = document.getElementById('themeToggle');

  function paintThemeIcon() {
    const t = document.documentElement.getAttribute('data-theme');
    themeToggle.innerHTML = icon(t === 'dark' ? 'sun' : 'moon');
  }
  paintThemeIcon();

  themeToggle.addEventListener('click', async () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    await DB.set('theme', next);
    paintThemeIcon();
  });

  const router = initRouter((route) => renderRoute(route));
  const palette = initCommandPalette((toolId) => router.go(`/tool/${toolId}`));
  document.getElementById('searchTrigger').addEventListener('click', palette.open);
  document.getElementById('settingsBtn').addEventListener('click', () => router.go('/settings'));
  document.getElementById('menuToggle').addEventListener('click', () => {
    sidebar.classList.toggle('open');
    sidebarBackdrop.classList.toggle('open');
  });
  sidebarBackdrop.addEventListener('click', () => {
    sidebar.classList.remove('open');
    sidebarBackdrop.classList.remove('open');
  });

  // "Go to Dashboard" was previously bound to Ctrl/Cmd+H, which is broken
  // on every platform: on macOS, Cmd+H is a system-level "Hide
  // Application" shortcut intercepted by the OS before the keystroke ever
  // reaches the browser tab, so the page's own keydown listener never
  // fires at all — no amount of preventDefault() can catch it. On
  // Windows/Linux, Ctrl+H is the browser's own reserved shortcut for
  // opening History in Chrome and Firefox, which pages can't reliably
  // override either. Any modifier+letter combo risks colliding with a
  // reserved OS/browser shortcut the same way — a sequential, no-modifier
  // shortcut (press g, then d) sidesteps that whole category of conflict,
  // the same pattern Gmail, GitHub, and Slack use for "go to" navigation.
  let goToBuffer = [];
  let goToTimer = null;
  document.addEventListener('keydown', (e) => {
    const target = e.target;
    const isTypingContext = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT' || target.isContentEditable);
    if (isTypingContext || e.metaKey || e.ctrlKey || e.altKey) { goToBuffer = []; return; }
    clearTimeout(goToTimer);
    goToBuffer.push(e.key.toLowerCase());
    if (goToBuffer.length > 2) goToBuffer.shift();
    if (goToBuffer.join('') === 'gd') { router.go('/'); goToBuffer = []; return; }
    goToTimer = setTimeout(() => { goToBuffer = []; }, 700);
  });

  buildSidebar(sidebar, router);

  async function renderRoute(route) {
    main.innerHTML = '';
    main.scrollTop = 0;
    sidebar.classList.remove('open');
    sidebarBackdrop.classList.remove('open');
    highlightSidebar(route);

    if (route.kind === 'dashboard') {
      await renderDashboard(main, (id) => router.go(`/tool/${id}`));
    } else if (route.kind === 'settings') {
      await renderSettings(main, { onThemeChange: (t) => { document.documentElement.setAttribute('data-theme', t); paintThemeIcon(); } });
    } else if (route.kind === 'category') {
      await renderDashboard(main, (id) => router.go(`/tool/${id}`)); // categories reuse dashboard grid via anchor scroll
    } else if (route.kind === 'tool') {
      const tool = getTool(route.id);
      if (!tool) { main.innerHTML = `<div class="main-inner"><div class="empty-state">Tool not found.</div></div>`; return; }
      await DB.pushRecent(tool.id);
      await DB.log(tool.id, 'open');
      const renderer = MODULE_ROUTERS[tool.category];
      if (renderer) await renderer(main, tool.id, (id) => router.go(`/tool/${id}`));
      // Injected centrally rather than per-tool: every category's shell
      // builder produces the same ".page-header" + body structure, so
      // this one spot covers all 75+ tools instead of touching each tool
      // function individually.
      const guideHtml = renderToolGuide(tool.id);
      if (guideHtml) {
        const header = main.querySelector('.page-header');
        if (header) {
          header.insertAdjacentHTML('afterend', guideHtml);
          const guideEl = header.nextElementSibling;
          if (guideEl && guideEl.classList.contains('tool-guide')) wireAnimatedDetails(guideEl);
        }
      }
    }
  }

  // Native <details> toggling has no transition at all — content snaps
  // open/closed in a single frame regardless of any CSS on it, because
  // the browser flips display state directly rather than animating a
  // style property. This intercepts the toggle and animates the content
  // height with the Web Animations API instead (broadly supported across
  // evergreen browsers, unlike newer CSS-only details-animation
  // techniques), so the one UI element present on every tool page opens
  // and closes with the same polish as the rest of the app.
  function wireAnimatedDetails(details) {
    const summary = details.querySelector(':scope > summary');
    const body = details.querySelector(':scope > .tool-guide-body');
    if (!summary || !body) return;
    let animating = false;
    summary.addEventListener('click', (e) => {
      e.preventDefault();
      if (animating) return;
      const reduceMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches || document.documentElement.dataset.reduceMotion === 'true';
      if (details.open) {
        // Closing: measure current height, animate down to 0, then set
        // open=false so the element truly leaves the accessibility tree
        // rather than just looking closed.
        const startHeight = body.offsetHeight;
        if (reduceMotion) { details.open = false; return; }
        animating = true;
        body.style.overflow = 'hidden';
        const anim = body.animate([{ height: `${startHeight}px` }, { height: '0px' }], { duration: 180, easing: 'cubic-bezier(0.4, 0, 0.2, 1)' });
        anim.onfinish = () => { details.open = false; body.style.overflow = ''; body.style.height = ''; animating = false; };
      } else {
        // Opening: set open=true first so the browser lays the content
        // out and we can measure its natural full height, then animate
        // from 0 up to that height.
        details.open = true;
        if (reduceMotion) return;
        animating = true;
        body.style.overflow = 'hidden';
        const endHeight = body.offsetHeight;
        const anim = body.animate([{ height: '0px' }, { height: `${endHeight}px` }], { duration: 200, easing: 'cubic-bezier(0.2, 0.7, 0.3, 1)' });
        anim.onfinish = () => { body.style.overflow = ''; body.style.height = ''; animating = false; };
      }
    });
  }

  renderRoute(router.current());
}

function buildSidebar(sidebar, router) {
  sidebar.innerHTML = `
    <div class="sidebar-brand"><span class="mark">OS</span> Offline Suite</div>
    <div class="sidebar-top-creator">
      <div class="creator-row">
        <span class="creator-avatar"><img src="data:image/png;base64,${CREATOR_AVATAR_B64}" alt="Priyansh Malik"></span>
        <span class="creator-info">
          <div class="creator-name">Priyansh Malik</div>
        </span>
        <a class="linkedin-chip" href="https://www.linkedin.com/in/priyanshmalik108" target="_blank" rel="noopener noreferrer" aria-label="Follow Priyansh Malik on LinkedIn">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.04-1.85-3.04-1.86 0-2.15 1.45-2.15 2.94v5.67H9.35V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.26 2.37 4.26 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
          Follow
        </a>
      </div>
    </div>
    <div class="sidebar-scroll">
      <div class="sidebar-section">
        <button class="nav-item" data-route="/">${icon('home')} Dashboard</button>
        <button class="nav-item" data-route="/settings">${icon('settings')} Settings</button>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-title">Workspaces</div>
        ${CATEGORIES.map(c => `
          <button class="nav-item" data-cat="${c.id}">
            ${icon(c.icon)} ${c.label} <span class="count">${TOOLS.filter(t => t.category === c.id).length}</span>
          </button>`).join('')}
      </div>
    </div>
    <div class="sidebar-footer">
      <div class="collab-line">For collaboration DM — <a href="mailto:mlk.priyansh@gmail.com">mlk.priyansh@gmail.com</a></div>
      <div class="creator-copyright">© 2026 Priyansh Malik. All rights reserved.</div>
    </div>`;
  sidebar.querySelectorAll('[data-route]').forEach(btn => btn.addEventListener('click', () => router.go(btn.dataset.route)));
  sidebar.querySelectorAll('[data-cat]').forEach(btn => btn.addEventListener('click', () => {
    router.go('/');
    setTimeout(() => {
      const heading = [...document.querySelectorAll('h2')].find(h => h.textContent.includes(CATEGORIES.find(c => c.id === btn.dataset.cat).label));
      heading?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 60);
  }));
}

function highlightSidebar(route) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (route.kind === 'dashboard') document.querySelector('[data-route="/"]')?.classList.add('active');
  if (route.kind === 'settings') document.querySelector('[data-route="/settings"]')?.classList.add('active');
  if (route.kind === 'tool') {
    const tool = getTool(route.id);
    if (tool) document.querySelector(`[data-cat="${tool.category}"]`)?.classList.add('active');
  }
}

// Global safety net: if any tool's async handler throws without its own
// try/catch (a CDN library failing to load, a corrupt input file, etc.),
// surface it as a readable toast instead of a silent console-only failure.
window.addEventListener('unhandledrejection', (event) => {
  const message = event.reason?.message || String(event.reason || 'Something went wrong');
  toast(message, 'error', 5000);
  event.preventDefault();
});

boot();
</script></body></html>
