const escapeHtml = UI.escapeHtml;
const withBusyButton = UI.withBusyButton;
const renderBatchQueue = BATCH.renderBatchQueue;
/**
 * pdf.js — PDF Workspace.
 *
 * Libraries (lazy-loaded from CDN on first use, then cached offline by the
 * service worker — see service-worker.js CACHE_ON_USE list):
 *   - pdf-lib  : create/edit PDFs (merge, split, rotate, delete, watermark,
 *                page numbers, images→pdf)
 *   - pdf.js   : render/rasterize pages, extract text content
 *   - Tesseract.js : OCR
 *   - mammoth.js + html2pdf.js : Word → PDF
 */



const CDN = {
  pdfLib: 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js',
  pdfjs: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
  pdfjsWorker: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js',
  tesseract: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js',
  mammoth: 'https://cdn.jsdelivr.net/npm/mammoth@1.7.2/mammoth.browser.min.js',
  html2pdf: 'https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js',
  html2canvas: 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',
  docxPreview: 'https://cdn.jsdelivr.net/npm/docx-preview@0.4.0/dist/docx-preview.min.js',
  docx: 'https://cdn.jsdelivr.net/npm/docx@9.6.1/dist/index.iife.js',
};

function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)) return resolve();
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('Could not load this tool\'s processing library — check your internet connection and try again.'));
    document.head.appendChild(s);
  });
}
async function getPdfLib() { await loadScript(CDN.pdfLib); return window.PDFLib; }
async function getPdfJs() {
  await loadScript(CDN.pdfjs);
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = CDN.pdfjsWorker;
  return window.pdfjsLib;
}
async function getTesseract() { await loadScript(CDN.tesseract); return window.Tesseract; }

// A small pool of persistent Tesseract workers, reused across every
// page/file in a batch instead of tesseract.js's one-shot `.recognize()`
// helper, which fully re-downloads and re-initializes a brand new worker
// on *every single call* — slow for anything beyond one page/image, and
// each redundant re-download is one more chance for a slow connection to
// make a long batch fail partway through. OEM 1 forces Tesseract's LSTM
// neural-net engine, its most accurate recognition mode. The pool is
// sized so files can still genuinely OCR in parallel (matching the app's
// batch concurrency) without each one re-downloading its own full copy of
// the language model.
async function createOcrWorker(lang) {
  const Tesseract = await getTesseract();
  return Tesseract.createWorker(lang, 1);
}
// Returns a `getWorker()` function backed by the pool above, plus a
// `getWorker.terminateAll()` method that must be called once every job
// sharing this pool has finished — each worker holds a live WASM instance
// and loaded language data in memory, and leaving it running after a batch
// completes silently leaks memory for the rest of the session.
function makeOcrWorkerPool(lang, size = 2) {
  const slots = new Array(size).fill(null);
  let next = 0;
  const getWorker = () => {
    const idx = next % size;
    next += 1;
    if (!slots[idx]) slots[idx] = createOcrWorker(lang);
    return slots[idx];
  };
  getWorker.terminateAll = async () => {
    await Promise.all(slots.filter(Boolean).map(async (p) => { try { (await p).terminate(); } catch { /* already gone */ } }));
  };
  return getWorker;
}
// Renders a PDF page to a canvas suitable for OCR: a higher resolution
// than on-screen rendering needs (Tesseract's accuracy drops off sharply
// below roughly 200-300 DPI-equivalent text) and a solid white background
// fill first, since PDF canvases start fully transparent and only pages
// that explicitly paint their own background end up opaque — a
// transparent region can otherwise be composited as black by consumers
// that don't expect an alpha channel, which is read as noise by OCR.
async function renderPageForOcr(page, scale = 3) {
  const viewport = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width; canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({ canvasContext: ctx, viewport }).promise;
  return canvas;
}
async function getMammoth() { await loadScript(CDN.mammoth); return window.mammoth; }
async function getHtml2Pdf() { await loadScript(CDN.html2pdf); return window.html2pdf; }
async function getHtml2Canvas() { await loadScript(CDN.html2canvas); return window.html2canvas; }
async function getDocxPreview() {
  // docx-preview needs JSZip on window — this app already bundles JSZip
  // inline for the batch-download ZIP feature, so it's already present.
  await loadScript(CDN.docxPreview);
  return window.docx;
}
async function getDocxLib() { await loadScript(CDN.docx); return window.docx; }


const readAsArrayBuffer = (file) => new Promise((res, rej) => {
  const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error(`Could not read "${file.name}" — the file may be corrupted.`)); r.readAsArrayBuffer(file);
});

/* ---------------------------------------------------------------- shell */
function workspaceShell(container, { title, desc, toolbarHTML = '' }) {
  const wrap = el('div', { class: 'main-inner' });
  wrap.innerHTML = `
    <div class="page-header">
      <div class="page-eyebrow">PDF Workspace</div>
      <h1 class="page-title">${title}</h1>
      <p class="page-sub">${desc}</p>
    </div>
    ${toolbarHTML}
    <div data-role="body"></div>`;
  container.appendChild(wrap);
  return wrap.querySelector('[data-role=body]');
}

/* =========================================================== pdf-merge */
async function toolMerge(body) {
  let files = [];
  const listWrap = el('div', { class: 'file-list' });
  const dz = makeDropzone({
    accept: '.pdf', multiple: true, hint: 'Drop PDFs to merge (order = merge order)',
    onFiles: (fs) => { files = files.concat(fs.filter(f => f.type === 'application/pdf' || f.name.endsWith('.pdf'))); draw(); },
  });
  body.append(dz, listWrap);
  const actions = el('div', { class: 'workspace-toolbar' });
  const mergeBtn = el('button', { class: 'btn primary', disabled: 'true' }, ['Merge PDFs']);
  actions.append(mergeBtn);
  body.append(actions);

  function draw() {
    listWrap.innerHTML = '';
    files.forEach((f, i) => {
      const row = el('div', { class: 'file-chip' });
      row.innerHTML = `<div class="file-icon">${icon('pdf')}</div>
        <div style="flex:1"><div class="file-name">${escapeHtml(f.name)}</div><div class="file-meta">${formatBytes(f.size)}</div></div>`;
      const actions2 = el('div', { class: 'file-actions' });
      if (i > 0) actions2.append(el('button', { class: 'btn ghost sm', 'aria-label': `Move ${f.name} earlier`, onclick: () => { [files[i - 1], files[i]] = [files[i], files[i - 1]]; draw(); } }, ['↑']));
      if (i < files.length - 1) actions2.append(el('button', { class: 'btn ghost sm', 'aria-label': `Move ${f.name} later`, onclick: () => { [files[i + 1], files[i]] = [files[i], files[i + 1]]; draw(); } }, ['↓']));
      actions2.append(el('button', { class: 'btn ghost sm', 'aria-label': `Remove ${f.name}`, onclick: () => { files.splice(i, 1); draw(); } }, [iconEl('trash')]));
      row.append(actions2);
      listWrap.append(row);
    });
    mergeBtn.disabled = files.length < 2;
  }

  withBusyButton(mergeBtn, 'Merging…', async () => {
    const PDFLib = await getPdfLib();
    const progress = makeProgress(body, 'Merging…');
    const out = await PDFLib.PDFDocument.create();
    for (let i = 0; i < files.length; i++) {
      const bytes = await readAsArrayBuffer(files[i]);
      const src = await PDFLib.PDFDocument.load(bytes);
      const pages = await out.copyPages(src, src.getPageIndices());
      pages.forEach(p => out.addPage(p));
      progress.set(((i + 1) / files.length) * 100);
    }
    const bytes = await out.save();
    downloadBlob(new Blob([bytes], { type: 'application/pdf' }), 'merged.pdf');
    progress.remove();
    await DB.log('pdf-merge', 'merge', `${files.length} files`);
    toast('Merged PDF downloaded', 'success');
    mergeBtn.disabled = files.length < 2;
  });
}

/* =========================================================== pdf-split */
async function toolSplit(body) {
  let file = null;
  const dz = makeDropzone({ accept: '.pdf', multiple: false, hint: 'Drop a PDF to split', onFiles: (fs) => { file = fs[0]; info.textContent = `${file.name} · ${formatBytes(file.size)}`; rangeField.style.display = 'block'; } });
  const info = el('div', { class: 'text-sm text-tertiary mt-16' });
  const rangeField = el('div', { class: 'card mt-16', style: 'display:none' });
  rangeField.innerHTML = `
    <div class="field">
      <label>Page ranges (comma-separated, e.g. 1-3, 4, 5-8)</label>
      <input type="text" placeholder="1-3, 4-6" data-role="ranges">
    </div>
    <button class="btn primary" data-role="go">Split into files</button>`;
  body.append(dz, info, rangeField);

  rangeField.querySelector('[data-role=go]').addEventListener('click', async () => {
    if (!file) return;
    const rangesStr = rangeField.querySelector('[data-role=ranges]').value.trim();
    if (!rangesStr) { toast('Enter at least one page range', 'error'); return; }
    const PDFLib = await getPdfLib();
    const bytes = await readAsArrayBuffer(file);
    const src = await PDFLib.PDFDocument.load(bytes);
    const total = src.getPageCount();
    const parts = rangesStr.split(',').map(s => s.trim()).filter(Boolean);
    const ranges = [];
    for (const part of parts) {
      const [a, b] = part.split('-').map(n => parseInt(n.trim(), 10));
      if (!Number.isFinite(a) || a < 1 || a > total || (b !== undefined && (!Number.isFinite(b) || b < a))) {
        toast(`"${part}" isn't a valid page range for a ${total}-page PDF`, 'error');
        return;
      }
      const start = Math.max(1, a) - 1, end = Math.min(total, b || a) - 1;
      ranges.push({ start, end, label: part.replace(/\s/g, '') });
    }
    const jobs = ranges.map((r, idx) => ({
      id: `split-${idx}`,
      label: `${file.name.replace(/\.pdf$/i, '')}_p${r.label}.pdf`,
      run: async () => {
        const out = await PDFLib.PDFDocument.create();
        const indices = [];
        for (let p = r.start; p <= r.end; p++) indices.push(p);
        const pages = await out.copyPages(src, indices);
        pages.forEach(p => out.addPage(p));
        const outBytes = await out.save();
        return new Blob([outBytes], { type: 'application/pdf' });
      },
    }));
    rangeField.remove();
    renderBatchQueue(body, jobs, { toolId: 'pdf-split', zipName: 'split-pages.zip', title: 'Split output' });
  });
}

/* ========================================================= pdf-organize */
async function toolOrganize(body) {
  let file = null, pdfjsDoc = null, pdfLibDoc = null, PDFLib = null;
  let pages = []; // { originalIndex, rotation, deleted }

  const dz = makeDropzone({ accept: '.pdf', multiple: false, hint: 'Drop a PDF to organize pages', onFiles: async (fs) => { await load(fs[0]); } });
  body.append(dz);
  const toolbar = el('div', { class: 'workspace-toolbar', style: 'display:none' });
  toolbar.innerHTML = `
    <button class="btn sm" data-act="rotate-all">${icon('image')} Rotate all 90°</button>
    <div class="divider"></div>
    <button class="btn sm danger" data-act="delete-selected">${icon('trash')} Delete selected</button>
    <button class="btn sm" data-act="extract-selected">Extract selected as new PDF</button>
    <div class="divider"></div>
    <button class="btn sm primary" data-act="save" style="margin-left:auto">Save changes</button>`;
  const grid = el('div', { class: 'grid cols-4 mt-16' });
  body.append(toolbar, grid);

  async function load(f) {
    file = f;
    PDFLib = await getPdfLib();
    const pdfjsLib = await getPdfJs();
    const bytes = await readAsArrayBuffer(file);
    pdfLibDoc = await PDFLib.PDFDocument.load(bytes.slice(0));
    pdfjsDoc = await pdfjsLib.getDocument({ data: bytes.slice(0) }).promise;
    // Capture each page's existing baked-in rotation (common on scanned
    // PDFs) so the tool can ADD the user's rotation on top of it, rather
    // than setRotation() below overwriting and losing the original value.
    pages = Array.from({ length: pdfjsDoc.numPages }, (_, i) => ({
      originalIndex: i, rotation: 0, deleted: false, selected: false,
      baseRotation: pdfLibDoc.getPage(i).getRotation().angle || 0,
    }));
    toolbar.style.display = 'flex';
    await draw();
  }

  async function draw() {
    grid.innerHTML = '';
    let dragSourceIndex = null;
    // Only non-deleted pages are ever rendered/orderable — deleted pages
    // stay in the underlying `pages` array (in case Save needs their
    // original position context) but are simply skipped here.
    const visible = pages.filter(p => !p.deleted);
    for (const p of visible) {
      const page = await pdfjsDoc.getPage(p.originalIndex + 1);
      const viewport = page.getViewport({ scale: 0.3, rotation: (p.baseRotation + p.rotation) % 360 });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width; canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      const card = el('div', {
        class: 'card', role: 'button', tabindex: '0', draggable: 'true',
        'aria-pressed': String(p.selected),
        'aria-label': `Page ${p.originalIndex + 1}${p.selected ? ', selected' : ''}. Draggable — drop on another page to reorder.`,
        style: `padding:8px;cursor:pointer;border-color:${p.selected ? 'var(--accent)' : 'var(--border-subtle)'}`,
      });
      card.append(canvas);
      const label = el('div', { class: 'text-sm text-tertiary', style: 'text-align:center;margin-top:4px' }, [`Page ${p.originalIndex + 1}`]);
      const rowBtns = el('div', { style: 'display:flex;gap:4px;justify-content:center;margin-top:4px;flex-wrap:wrap' });
      const visIdx = visible.indexOf(p);
      rowBtns.append(
        el('button', { class: 'btn ghost sm', title: 'Move earlier', 'aria-label': `Move page ${p.originalIndex + 1} earlier`, disabled: visIdx === 0 ? 'true' : null, onclick: (e) => { e.stopPropagation(); movePage(p, -1); } }, ['←']),
        el('button', { class: 'btn ghost sm', title: 'Move later', 'aria-label': `Move page ${p.originalIndex + 1} later`, disabled: visIdx === visible.length - 1 ? 'true' : null, onclick: (e) => { e.stopPropagation(); movePage(p, 1); } }, ['→']),
        el('button', { class: 'btn ghost sm', title: 'Rotate', 'aria-label': `Rotate page ${p.originalIndex + 1}`, onclick: (e) => { e.stopPropagation(); p.rotation = (p.rotation + 90) % 360; draw(); } }, ['⟳']),
        el('button', { class: 'btn ghost sm', title: 'Delete', 'aria-label': `Delete page ${p.originalIndex + 1}`, onclick: (e) => { e.stopPropagation(); p.deleted = true; draw(); } }, [iconEl('trash')]),
      );
      card.addEventListener('click', () => { p.selected = !p.selected; draw(); });
      card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); p.selected = !p.selected; draw(); } });
      // Drag-and-drop reordering, for mouse users who'd rather drag a
      // thumbnail than click ←/→ repeatedly on a long document.
      card.addEventListener('dragstart', (e) => { dragSourceIndex = pages.indexOf(p); e.dataTransfer.effectAllowed = 'move'; });
      card.addEventListener('dragover', (e) => { e.preventDefault(); card.style.outline = '2px dashed var(--accent)'; });
      card.addEventListener('dragleave', () => { card.style.outline = ''; });
      card.addEventListener('drop', (e) => {
        e.preventDefault(); card.style.outline = '';
        if (dragSourceIndex === null) return;
        const draggedPage = pages[dragSourceIndex];
        if (!draggedPage || draggedPage === p) { dragSourceIndex = null; return; }
        pages.splice(dragSourceIndex, 1);
        pages.splice(pages.indexOf(p), 0, draggedPage);
        dragSourceIndex = null;
        draw();
      });
      card.append(label, rowBtns);
      grid.append(card);
    }
  }
  // Moves a page earlier/later among the currently-visible (non-deleted)
  // pages by swapping its position in the underlying `pages` array — used
  // by both the ←/→ buttons and as the accessible equivalent of dragging.
  function movePage(p, dir) {
    const idx = pages.indexOf(p);
    let swapWith = idx + dir;
    // Skip over any deleted pages sitting between the two visible pages
    // being swapped, so ←/→ always moves relative to the next *visible*
    // neighbor, not the next array slot (which could be a deleted page).
    while (swapWith >= 0 && swapWith < pages.length && pages[swapWith].deleted) swapWith += dir;
    if (swapWith < 0 || swapWith >= pages.length) return;
    [pages[idx], pages[swapWith]] = [pages[swapWith], pages[idx]];
    draw();
  }

  toolbar.querySelector('[data-act=rotate-all]').addEventListener('click', () => { pages.forEach(p => { if (!p.deleted) p.rotation = (p.rotation + 90) % 360; }); draw(); });
  toolbar.querySelector('[data-act=delete-selected]').addEventListener('click', () => { pages.forEach(p => { if (p.selected) p.deleted = true; }); draw(); });
  const extractBtn = toolbar.querySelector('[data-act=extract-selected]');
  extractBtn.addEventListener('click', async () => {
    const chosen = pages.filter(p => p.selected && !p.deleted);
    if (!chosen.length) { toast('Select at least one page', 'error'); return; }
    extractBtn.disabled = true;
    const originalLabel = extractBtn.textContent;
    extractBtn.textContent = 'Extracting…';
    try {
      const out = await PDFLib.PDFDocument.create();
      const src = await PDFLib.PDFDocument.load(await readAsArrayBuffer(file));
      const copied = await out.copyPages(src, chosen.map(p => p.originalIndex));
      copied.forEach((pg, i) => { pg.setRotation(PDFLib.degrees((chosen[i].baseRotation + chosen[i].rotation) % 360)); out.addPage(pg); });
      downloadBlob(new Blob([await out.save()], { type: 'application/pdf' }), 'extracted.pdf');
      toast('Extracted pages downloaded', 'success');
    } finally {
      extractBtn.disabled = false;
      extractBtn.textContent = originalLabel;
    }
  });
  const saveBtn = toolbar.querySelector('[data-act=save]');
  saveBtn.addEventListener('click', async () => {
    saveBtn.disabled = true;
    const originalLabel = saveBtn.textContent;
    saveBtn.textContent = 'Saving…';
    try {
      const out = await PDFLib.PDFDocument.create();
      const src = await PDFLib.PDFDocument.load(await readAsArrayBuffer(file));
      const keep = pages.filter(p => !p.deleted);
      const copied = await out.copyPages(src, keep.map(p => p.originalIndex));
      copied.forEach((pg, i) => { pg.setRotation(PDFLib.degrees((keep[i].baseRotation + keep[i].rotation) % 360)); out.addPage(pg); });
      downloadBlob(new Blob([await out.save()], { type: 'application/pdf' }), `organized-${file.name}`);
      await DB.log('pdf-organize', 'save', `${keep.length} pages kept`);
      toast('Saved PDF downloaded', 'success');
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = originalLabel;
    }
  });
}

/* ========================================================= pdf-compress */
// Slider maps 0–100 onto this DPI/JPEG-quality range. Labeled zones are
// shown under the slider as a guide; the value itself is continuous, not
// snapped, so you can land anywhere between "Low" and "Maximum".
const COMPRESS_RANGE = { dpiMin: 72, dpiMax: 200, qMin: 0.4, qMax: 0.9 };
function compressSettingsFromSlider(v) {
  const t = v / 100;
  return {
    dpi: Math.round(COMPRESS_RANGE.dpiMin + (COMPRESS_RANGE.dpiMax - COMPRESS_RANGE.dpiMin) * t),
    quality: +(COMPRESS_RANGE.qMin + (COMPRESS_RANGE.qMax - COMPRESS_RANGE.qMin) * t).toFixed(2),
  };
}
async function toolCompress(body) {
  let files = [];
  const listPanel = makeFileListPanel({ onChange: (updated) => { files = updated; render(); } });
  const dz = makeDropzone({ accept: '.pdf', multiple: true, hint: 'Drop PDFs to compress (batch supported)', onFiles: (fs) => { files = files.concat(fs); listPanel.setFiles(files); render(); } });
  body.append(dz, listPanel.el);
  const holder = el('div');
  body.append(holder);
  let lossless = false;
  let sliderVal = 50; // 0–100, maps to dpi/quality via compressSettingsFromSlider

  function render() {
    holder.innerHTML = '';
    if (!files.length) return;

    const wrap = el('div', { class: 'row mt-16', style: 'align-items:flex-start' });
    const card = el('div', { class: 'card' });
    card.innerHTML = `<label style="font-size:12.5px;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:8px">Compression level</label>`;
    const losslessBtn = el('button', { class: 'btn sm' }, ['Lossless (structure only)']);
    losslessBtn.addEventListener('click', () => { lossless = true; syncMode(); schedulePreview(true); });
    const rasterBtn = el('button', { class: 'btn sm' }, ['Re-render pages (drag to control quality)']);
    rasterBtn.addEventListener('click', () => { lossless = false; syncMode(); schedulePreview(true); });
    const modeRow = el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px' }, [losslessBtn, rasterBtn]);
    card.append(modeRow);

    const sliderField = el('div', { class: 'field' });
    sliderField.innerHTML = `
      <label>Quality — drag to preview</label>
      <input type="range" data-role="slider" min="0" max="100" step="1" value="${sliderVal}">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-tertiary);margin-top:2px">
        <span>Low (smallest file)</span><span>Medium</span><span>High</span><span>Maximum (largest file)</span>
      </div>`;
    card.append(sliderField);
    const sliderInput = sliderField.querySelector('[data-role=slider]');
    sliderInput.addEventListener('input', () => { sliderVal = parseInt(sliderInput.value, 10); schedulePreview(false); });
    sliderInput.addEventListener('change', () => schedulePreview(true));

    const desc = el('div', { class: 'text-sm text-tertiary mt-8' });
    card.append(desc);

    function syncMode() {
      losslessBtn.classList.toggle('primary', lossless);
      rasterBtn.classList.toggle('primary', !lossless);
      sliderField.style.display = lossless ? 'none' : '';
      desc.textContent = lossless
        ? 'Removes redundant internal structure only — text stays selectable, images are untouched, smallest guaranteed-safe reduction.'
        : '';
    }
    syncMode();
    wrap.append(card);

    // Live preview panel — renders page 1 of the first PDF at the current
    // slider setting for real and measures the actual resulting bytes, so
    // the numbers you see are a genuine encode, not a guess.
    const preview = el('div', { class: 'card' });
    wrap.append(preview);
    holder.append(wrap);

    let previewTimer = null;
    function schedulePreview(immediate) {
      if (lossless) { preview.innerHTML = `<div class="text-sm text-tertiary">Lossless mode doesn't change resolution — file size reduction depends on how much redundant structure the PDF already has.</div>`; return; }
      clearTimeout(previewTimer);
      if (immediate) return runPreview();
      previewTimer = setTimeout(runPreview, 200);
    }
    let previewToken = 0;
    async function runPreview() {
      const token = ++previewToken;
      const f = files[0];
      if (!f) return;
      preview.innerHTML = `<div class="text-sm text-tertiary">Calculating…</div>`;
      try {
        const { dpi, quality } = compressSettingsFromSlider(sliderVal);
        const pdfjsLib = await getPdfJs();
        const bytes = await readAsArrayBuffer(f);
        if (token !== previewToken) return;
        const doc = await pdfjsLib.getDocument({ data: bytes }).promise;
        const page = await doc.getPage(1);
        const viewport = page.getViewport({ scale: dpi / 72 });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width; canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        if (token !== previewToken) return;
        const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
        if (token !== previewToken) return;
        const estTotal = blob.size * doc.numPages; // page 1 is representative; real per-page sizes vary with content
        const pct = Math.round((1 - estTotal / f.size) * 100);
        preview.innerHTML = `
          <div style="font-size:12.5px;font-weight:600;color:var(--text-secondary);margin-bottom:10px">Live preview — page 1 of ${escapeHtml(f.name)}</div>
          <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-subtle)"><span class="text-sm text-tertiary">Render resolution</span><strong>${dpi} DPI</strong></div>
          <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-subtle)"><span class="text-sm text-tertiary">Pixel size (page 1)</span><strong>${canvas.width} × ${canvas.height} px</strong></div>
          <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-subtle)"><span class="text-sm text-tertiary">JPEG quality</span><strong>${Math.round(quality * 100)}%</strong></div>
          <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-subtle)"><span class="text-sm text-tertiary">Original size</span><strong>${formatBytes(f.size)}</strong></div>
          <div style="display:flex;justify-content:space-between;padding:6px 0"><span class="text-sm text-tertiary">Estimated output${doc.numPages > 1 ? ` (${doc.numPages} pages)` : ''}</span><strong style="color:var(--accent-strong)">${formatBytes(estTotal)}${Number.isFinite(pct) ? ` <span class="text-tertiary" style="font-weight:400">(${pct >= 0 ? '−' : '+'}${Math.abs(pct)}%)</span>` : ''}</strong></div>
          ${doc.numPages > 1 ? '<div class="text-sm text-tertiary mt-8">Estimated from page 1 — pages with more images/text will compress differently.</div>' : ''}`;
      } catch (e) {
        if (token === previewToken) preview.innerHTML = `<div class="text-sm text-tertiary">Preview unavailable for this file.</div>`;
      }
    }
    schedulePreview(true);

    const btn = el('button', { class: 'btn primary mt-16' }, [`Compress ${files.length} PDF${files.length === 1 ? '' : 's'}`]);
    holder.append(btn);
    withBusyButton(btn, 'Compressing…', async () => {
      const PDFLib = await getPdfLib();
      const losslessAtClick = lossless;
      const { dpi, quality } = compressSettingsFromSlider(sliderVal);
      const jobs = files.map((f, idx) => ({
        id: `c${idx}`, label: `compressed-${f.name}`, originalSize: f.size,
        run: async (onProgress) => {
          const bytes = await readAsArrayBuffer(f);
          if (losslessAtClick) {
            const doc = await PDFLib.PDFDocument.load(bytes, { updateMetadata: false });
            const out = await doc.save({ useObjectStreams: true, addDefaultPage: false });
            return new Blob([out], { type: 'application/pdf' });
          }
          const pdfjsLib = await getPdfJs();
          const srcDoc = await pdfjsLib.getDocument({ data: bytes }).promise;
          const outDoc = await PDFLib.PDFDocument.create();
          const scale = dpi / 72; // pdf.js viewport scale is relative to 72 DPI (1 PDF point = 1/72")
          for (let i = 1; i <= srcDoc.numPages; i++) {
            const page = await srcDoc.getPage(i);
            const viewport = page.getViewport({ scale });
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width; canvas.height = viewport.height;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
            const jpegBlob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
            const jpegBytes = new Uint8Array(await jpegBlob.arrayBuffer());
            const img = await outDoc.embedJpg(jpegBytes);
            // Keep the output page the same physical size as the original
            // (in PDF points) regardless of render DPI, so print/view size
            // doesn't change — only the embedded image resolution does.
            const origViewport = page.getViewport({ scale: 1 });
            const pdfPage = outDoc.addPage([origViewport.width, origViewport.height]);
            pdfPage.drawImage(img, { x: 0, y: 0, width: origViewport.width, height: origViewport.height });
            onProgress((i / srcDoc.numPages) * 100);
          }
          const outBytes = await outDoc.save();
          return new Blob([outBytes], { type: 'application/pdf' });
        },
      }));
      btn.remove(); wrap.remove();
      listPanel.setFiles([]); files = [];
      renderBatchQueue(holder, jobs, { toolId: 'pdf-compress', zipName: 'compressed.zip', title: 'Compression queue' });
    });
  }
}

async function toolWatermark(body, mode) {
  let files = [];
  const listPanel = makeFileListPanel({ onChange: (updated) => { files = updated; form.style.display = files.length ? 'block' : 'none'; } });
  const dz = makeDropzone({ accept: '.pdf', multiple: true, hint: 'Drop PDFs', onFiles: (fs) => { files = files.concat(fs); listPanel.setFiles(files); form.style.display = 'block'; } });
  const form = el('div', { class: 'card mt-16', style: 'display:none' });
  if (mode === 'watermark') {
    form.innerHTML = `
      <div class="field"><label>Watermark text</label><input type="text" data-role="text" value="CONFIDENTIAL"></div>
      <div class="row">
        <div class="field"><label>Font size</label><input type="number" data-role="size" value="48"></div>
        <div class="field"><label>Opacity (0–1)</label><input type="number" data-role="opacity" value="0.25" step="0.05" min="0" max="1"></div>
      </div>
      <button class="btn primary" data-role="go">Apply watermark</button>`;
  } else {
    form.innerHTML = `
      <div class="row">
        <div class="field"><label>Start number</label><input type="number" data-role="start" value="1"></div>
        <div class="field"><label>Position</label>
          <select data-role="pos"><option value="bottom-right">Bottom right</option><option value="bottom-center">Bottom center</option><option value="top-right">Top right</option></select>
        </div>
      </div>
      <button class="btn primary" data-role="go">Add page numbers</button>`;
  }
  body.append(dz, listPanel.el, form);


  form.querySelector('[data-role=go]').addEventListener('click', async () => {
    const PDFLib = await getPdfLib();
    const jobs = files.map((f, idx) => ({
      id: `w${idx}`,
      label: `${mode === 'watermark' ? 'watermarked' : 'numbered'}-${f.name}`,
      run: async () => {
        const bytes = await readAsArrayBuffer(f);
        const doc = await PDFLib.PDFDocument.load(bytes);
        const font = await doc.embedFont(PDFLib.StandardFonts.HelveticaBold);
        const pagesArr = doc.getPages();
        if (mode === 'watermark') {
          const text = form.querySelector('[data-role=text]').value || 'CONFIDENTIAL';
          const size = parseFloat(form.querySelector('[data-role=size]').value) || 48;
          const opacity = parseFloat(form.querySelector('[data-role=opacity]').value) || 0.25;
          const angleDeg = 35;
          const theta = angleDeg * Math.PI / 180;
          pagesArr.forEach(p => {
            const { width, height } = p.getSize();
            const textWidth = font.widthOfTextAtSize(text, size);
            const textHeight = size * 0.7; // approximate cap-height above the baseline
            // pdf-lib rotates text around its baseline-start point (the
            // bottom-left of the unrotated glyph box), not around its
            // visual center — so placing the origin at the page's center
            // minus half the (unrotated) text width only centers the text
            // correctly when rotate is 0. Once the 35° rotation is
            // applied around that same anchor, the visually-apparent
            // watermark swings down and to the left of true center,
            // noticeably more so the longer the watermark text is. This
            // solves for the origin that puts the rotated text's actual
            // center — not its unrotated bounding-box corner — on the
            // page's true center point.
            const cx = width / 2, cy = height / 2;
            const x = cx - (textWidth / 2) * Math.cos(theta) + (textHeight / 2) * Math.sin(theta);
            const y = cy - (textWidth / 2) * Math.sin(theta) - (textHeight / 2) * Math.cos(theta);
            p.drawText(text, {
              x, y, size, font,
              color: PDFLib.rgb(0.4, 0.1, 0.1), opacity, rotate: PDFLib.degrees(angleDeg),
            });
          });
        } else {
          const start = parseInt(form.querySelector('[data-role=start]').value, 10) || 1;
          const pos = form.querySelector('[data-role=pos]').value;
          pagesArr.forEach((p, i) => {
            const { width, height } = p.getSize();
            const label = String(start + i);
            const x = pos.includes('right') ? width - 50 : width / 2 - 6;
            const y = pos.startsWith('top') ? height - 36 : 24;
            p.drawText(label, { x, y, size: 11, font, color: PDFLib.rgb(0.2, 0.2, 0.2) });
          });
        }
        const out = await doc.save();
        return new Blob([out], { type: 'application/pdf' });
      },
    }));
    form.remove();
    renderBatchQueue(body, jobs, { toolId: mode === 'watermark' ? 'pdf-watermark' : 'pdf-page-numbers', zipName: 'output.zip', title: 'Output' });
  });
}

/* ========================================================= images-to-pdf */
const PAGE_SIZES = {
  a4: [595.28, 841.89],
  letter: [612, 792],
};
// pdf-lib can only embed PNG or JPEG bytes directly. The dropzone accepts
// any image/* file (WEBP, GIF, BMP, etc.), so anything that isn't already
// one of those two gets decoded and re-encoded to PNG via canvas first —
// otherwise embedJpg() throws on non-JPEG bytes and silently kills the
// whole batch.
function loadImageEl(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(`Could not read "${file.name}" as an image.`)); };
    img.src = url;
  });
}
async function normalizeToPngBytes(file) {
  const img = await loadImageEl(file);
  const canvas = document.createElement('canvas');
  canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
  canvas.getContext('2d').drawImage(img, 0, 0);
  const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
  return new Uint8Array(await blob.arrayBuffer());
}
async function toolImagesToPdf(body) {
  let files = [];
  const listPanel = makeFileListPanel({ onChange: (updated) => { files = updated; draw(); } });
  const dz = makeDropzone({ accept: 'image/*', multiple: true, hint: 'Drop images (order = page order)', onFiles: (fs) => { files = files.concat(fs); listPanel.setFiles(files); draw(); } });
  const optsCard = el('div', { class: 'card mt-16' });
  optsCard.innerHTML = `
    <div class="row">
      <div class="field"><label>Page size</label>
        <select data-role="pagesize">
          <option value="fit">Fit to image (original size)</option>
          <option value="a4">A4</option>
          <option value="letter">Letter</option>
        </select>
      </div>
      <div class="field" data-role="orientation-field"><label>Orientation</label>
        <select data-role="orientation">
          <option value="auto">Auto (match each image)</option>
          <option value="portrait">Portrait</option>
          <option value="landscape">Landscape</option>
        </select>
      </div>
    </div>
    <div class="field" data-role="margin-field">
      <label>Margin</label>
      <select data-role="margin">
        <option value="0">None</option>
        <option value="18">Small (0.25")</option>
        <option value="36" selected>Normal (0.5")</option>
        <option value="72">Wide (1")</option>
      </select>
    </div>`;
  const pageSizeSel = optsCard.querySelector('[data-role=pagesize]');
  const orientField = optsCard.querySelector('[data-role=orientation-field]');
  const marginField = optsCard.querySelector('[data-role=margin-field]');
  function syncOptsVisibility() {
    const fitMode = pageSizeSel.value === 'fit';
    orientField.style.display = fitMode ? 'none' : '';
    marginField.style.display = fitMode ? 'none' : '';
  }
  pageSizeSel.addEventListener('change', syncOptsVisibility);
  syncOptsVisibility();
  const btn = el('button', { class: 'btn primary mt-16', disabled: 'true' }, ['Create PDF']);
  body.append(dz, listPanel.el, optsCard, btn);
  function draw() {
    btn.disabled = files.length === 0;
  }
  withBusyButton(btn, 'Building PDF…', async () => {
    const PDFLib = await getPdfLib();
    const pageSizeMode = pageSizeSel.value;
    const orientation = optsCard.querySelector('[data-role=orientation]').value;
    const margin = parseInt(optsCard.querySelector('[data-role=margin]').value, 10);
    const doc = await PDFLib.PDFDocument.create();
    const progress = makeProgress(body, 'Building PDF…');
    for (let i = 0; i < files.length; i++) {
      const bytes = await readAsArrayBuffer(files[i]);
      const type = files[i].type;
      let img;
      if (type === 'image/png') img = await doc.embedPng(bytes);
      else if (type === 'image/jpeg' || type === 'image/jpg') img = await doc.embedJpg(bytes);
      else img = await doc.embedPng(await normalizeToPngBytes(files[i])); // WEBP/GIF/BMP/etc.
      if (pageSizeMode === 'fit') {
        const page = doc.addPage([img.width, img.height]);
        page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
      } else {
        let [pw, ph] = PAGE_SIZES[pageSizeMode];
        const imgIsLandscape = img.width > img.height;
        const wantLandscape = orientation === 'landscape' || (orientation === 'auto' && imgIsLandscape);
        if (wantLandscape) [pw, ph] = [ph, pw];
        const page = doc.addPage([pw, ph]);
        const availW = pw - margin * 2, availH = ph - margin * 2;
        const fitScale = Math.min(availW / img.width, availH / img.height);
        const drawW = img.width * fitScale, drawH = img.height * fitScale;
        page.drawImage(img, { x: (pw - drawW) / 2, y: (ph - drawH) / 2, width: drawW, height: drawH });
      }
      progress.set(((i + 1) / files.length) * 100);
    }
    downloadBlob(new Blob([await doc.save()], { type: 'application/pdf' }), 'images.pdf');
    progress.remove();
    toast('PDF created', 'success');
    btn.disabled = files.length === 0;
  });
}

// Wait for every <img> under `root` to finish loading — needed before
// each page capture, since image decode is asynchronous even once the
// element is in the DOM.
function waitForImagesToLoad(root) {
  const imgs = Array.from(root.querySelectorAll('img'));
  return Promise.all(imgs.map((img) => (img.complete ? Promise.resolve() : new Promise((res) => { img.onload = res; img.onerror = res; }))));
}

async function toolWordToPdf(body) {
  makeStagedFileTool(body, {
    accept: '.docx', hint: 'Drop .docx files to convert to PDF',
    buttonLabel: (n) => n > 1 ? `Convert ${n} files to PDF` : 'Convert to PDF',
    run: async (files, holder) => {
      const docxPreview = await getDocxPreview();
      const html2canvas = await getHtml2Canvas();
      const PDFLib = await getPdfLib();
      const jobs = files.map((f, idx) => ({
        id: `wp${idx}`,
        label: `${f.name.replace(/\.docx$/i, '')}.pdf`,
        run: async () => {
          const bytes = await readAsArrayBuffer(f);

          // Prior approaches tried and replaced here, in order:
          //
          // 1) A position:fixed capture container — html2canvas cannot
          //    reliably measure the height of an element that is itself
          //    position:fixed/absolute, producing a blank single page.
          //    Fixed by keeping the captured element in normal static
          //    flow, hidden via a zero-size *ancestor* wrapper instead.
          //
          // 2) mammoth.js + html2pdf, rendering the whole document as one
          //    html2canvas capture. This hit three more real problems:
          //    a hard per-browser canvas-size ceiling silently producing
          //    all-blank pages past ~25 printed pages; mammoth stripping
          //    almost all direct Word formatting (colors, highlighting,
          //    shading) by design, producing black-and-white text only;
          //    and independently auto-paginating each chunk, which left
          //    stray near-blank pages wherever a chunk didn't end exactly
          //    on a page boundary.
          //
          // 3) Switched to docx-preview (renders real OOXML formatting,
          //    not a stripped export) with manual, page-accurate chunking
          //    so every chunk maps to exactly one PDF page. This fixed
          //    color/formatting fidelity and the stray-blank-page problem,
          //    but introduced a new, subtler bug: each page-sized capture
          //    container was a bare element carrying only inline styles,
          //    without the "docx" class docx-preview's own stylesheet
          //    keys off of. That silently dropped `box-sizing:
          //    border-box` (skewing the container's true aspect ratio,
          //    which then stretched/blurred the final image once drawn
          //    onto a page sized for the *intended* ratio), dropped
          //    default paragraph margins/spacing (reflowing content to a
          //    different height than what pagination was calculated
          //    against, pushing some text out of the captured area and
          //    reading as "missing"), and dropped text-wrapping rules.
          //
          // Fix: reproduce the exact class + inline-style context the
          // real preview uses for every page capture (including a
          // ".docx-wrapper" ancestor, since some rules are scoped to it),
          // and derive the image's drawn width *and* height directly from
          // the canvas's own true pixel size rather than assuming it
          // matches a nominal page width — removing any remaining
          // assumption that could cause stretching. Also waits for
          // embedded/web fonts to finish loading before the first
          // capture (avoids a font-swap mid-conversion reading as blur),
          // and moves the off-screen render host far outside the
          // viewport instead of relying on z-index layering, so there is
          // no possibility of a visible flash while converting.
          const wrapper = document.createElement('div');
          wrapper.style.cssText = 'position:fixed;left:-99999px;top:-99999px;width:0;height:0;overflow:visible;';
          const styleHost = document.createElement('div');
          const bodyHost = document.createElement('div');
          wrapper.appendChild(styleHost);
          wrapper.appendChild(bodyHost);
          document.body.appendChild(wrapper);
          try {
            await docxPreview.renderAsync(bytes, bodyHost, styleHost, {
              inWrapper: true,
              breakPages: true,
              ignoreLastRenderedPageBreak: false,
              renderHeaders: false,
              renderFooters: false,
              renderFootnotes: true,
              renderEndnotes: true,
            });

            const sections = Array.from(bodyHost.querySelectorAll('.docx-wrapper > section.docx'));
            if (!sections.length) {
              throw new Error('This document could not be rendered — it may be corrupted or in an unsupported format.');
            }

            if (document.fonts && document.fonts.ready) {
              await Promise.race([document.fonts.ready, new Promise((res) => setTimeout(res, 2000))]);
            }

            const PX_PER_PT = 96 / 72; // CSS px per point, matching the browser's own unit conversion
            const SCALE = 2.5; // high-quality raster: crisp at normal zoom and reasonable print resolution
            const outDoc = await PDFLib.PDFDocument.create();

            for (const section of sections) {
              const widthPt = parseFloat(section.style.width) || 595.28;
              const heightPt = parseFloat(section.style.minHeight) || 841.89;
              const paddingParts = (section.style.padding || '72pt').split(/\s+/).map((v) => parseFloat(v) || 0);
              const padTopPt = paddingParts[0];
              const padRightPt = paddingParts[1] !== undefined ? paddingParts[1] : paddingParts[0];
              const padBottomPt = paddingParts[2] !== undefined ? paddingParts[2] : paddingParts[0];
              const sectionStyleText = section.getAttribute('style');
              const sectionClassName = section.className; // carries the "docx" class that box-sizing, paragraph spacing, table borders, and text wrapping all depend on
              const contentHeightPx = (heightPt - padTopPt - padBottomPt) * PX_PER_PT;
              // Small proactive safety margin: real Word documents can
              // reflow slightly differently once moved into the capture
              // container than they measured in docx-preview's original
              // continuous flow (font/metric edge cases, list numbering,
              // table row sizing) — a little headroom per page keeps a
              // chunk from landing just over one page's worth of height,
              // which is what was cutting text off at the bottom of a page
              // and continuing it, mid-line, onto the next.
              const SAFETY_MARGIN_PX = 28;
              const chunkThresholdPx = Math.max(200, contentHeightPx - SAFETY_MARGIN_PX);

              const article = section.querySelector(':scope > article') || section;
              const articleClassName = article.className;
              const blockEls = Array.from(article.children);

              // Fill each chunk up to one real page's worth of height,
              // only ever breaking between top-level elements (never
              // mid-paragraph/mid-row) — this is what makes every chunk
              // map to exactly one PDF page.
              const chunks = [];
              let current = [];
              let currentHeight = 0;
              blockEls.forEach((node) => {
                const h = node.offsetHeight || 0;
                if (current.length && currentHeight + h > chunkThresholdPx) {
                  chunks.push(current);
                  current = [];
                  currentHeight = 0;
                }
                current.push(node);
                currentHeight += h;
              });
              if (current.length) chunks.push(current);
              if (!chunks.length) chunks.push([]);

              for (const chunkNodes of chunks) {
                const pageOuter = document.createElement('div');
                pageOuter.className = 'docx-wrapper';
                const pageDiv = document.createElement('section');
                pageDiv.className = sectionClassName;
                pageDiv.setAttribute('style', sectionStyleText);
                pageDiv.style.minHeight = '0';
                pageDiv.style.height = 'auto';
                const articleClone = document.createElement('article');
                articleClone.className = articleClassName;
                chunkNodes.forEach((node) => articleClone.appendChild(node));
                if (!articleClone.children.length) articleClone.innerHTML = '&nbsp;';
                pageDiv.appendChild(articleClone);
                pageOuter.appendChild(pageDiv);
                wrapper.appendChild(pageOuter);

                await waitForImagesToLoad(pageDiv);
                const canvas = await html2canvas(pageDiv, { scale: SCALE, useCORS: true, backgroundColor: '#ffffff' });
                pageOuter.remove();

                if (!canvas || canvas.width < 2 || canvas.height < 2) {
                  throw new Error('The rendered PDF came back empty — this document may use formatting that could not be rendered.');
                }
                const pngBlob = await new Promise((res) => canvas.toBlob(res, 'image/png'));
                const pngBytes = new Uint8Array(await pngBlob.arrayBuffer());
                const img = await outDoc.embedPng(pngBytes);
                const pdfPage = outDoc.addPage([widthPt, heightPt]);
                // Derive both drawn dimensions from the canvas's own true
                // pixel size (not the assumed nominal page width) — this
                // is what guarantees no stretching/blur even if some
                // other subtle sizing discrepancy remains.
                let drawWidthPt = (canvas.width / SCALE) * (72 / 96);
                let drawHeightPt = (canvas.height / SCALE) * (72 / 96);
                // Hard guarantee on top of the safety margin above: if a
                // chunk still comes out taller than the real page for any
                // reason, scale the whole page image down proportionally
                // to fit rather than ever clipping the bottom of it.
                if (drawHeightPt > heightPt) {
                  const shrink = heightPt / drawHeightPt;
                  drawWidthPt *= shrink;
                  drawHeightPt *= shrink;
                }
                const drawX = (widthPt - drawWidthPt) / 2;
                pdfPage.drawImage(img, { x: drawX, y: heightPt - drawHeightPt, width: drawWidthPt, height: drawHeightPt });
              }
            }

            const finalBytes = await outDoc.save();
            const pdfBlob = new Blob([finalBytes], { type: 'application/pdf' });
            if (!pdfBlob || pdfBlob.size < 1000 || outDoc.getPageCount() < 1) {
              throw new Error('The rendered PDF came back empty — this document may use formatting that could not be rendered.');
            }
            return pdfBlob;
          } finally {
            wrapper.remove();
          }
        },
      }));
      renderBatchQueue(holder, jobs, { toolId: 'word-to-pdf', zipName: 'converted.zip', title: 'Word → PDF queue' });
    },
  });
}

/* ========================================================= pdf-sign */
async function toolSign(body) {
  let file = null;
  const dz = makeDropzone({ accept: '.pdf', multiple: false, hint: 'Drop a PDF to sign', onFiles: async (fs) => { file = fs[0]; padArea.style.display = 'block'; } });
  const padArea = el('div', { class: 'card mt-16', style: 'display:none' });
  padArea.innerHTML = `
    <div class="field"><label>Draw your signature</label></div>
    <canvas data-role="pad" width="500" height="160" style="width:100%;max-width:500px;border:1px solid var(--border-strong);border-radius:8px;background:#fff;touch-action:none;cursor:crosshair"></canvas>
    <div class="row mt-16">
      <div class="field"><label>Page (1-based)</label><input type="number" data-role="page" value="1" min="1"></div>
      <div class="field"><label>Position</label><select data-role="pos"><option value="bottom-right">Bottom right</option><option value="bottom-left">Bottom left</option><option value="bottom-center">Bottom center</option></select></div>
    </div>
    <div class="workspace-toolbar" style="border:none;padding-top:0">
      <button class="btn sm ghost" data-role="clear">Clear</button>
      <button class="btn primary" data-role="apply" style="margin-left:auto">Apply signature & download</button>
    </div>`;
  body.append(dz, padArea);

  const canvas = padArea.querySelector('[data-role=pad]');
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.strokeStyle = '#1a1a2e';
  let drawing = false, hasStroke = false;
  function pos(e) { const r = canvas.getBoundingClientRect(); const p = e.touches ? e.touches[0] : e; return { x: (p.clientX - r.left) * (canvas.width / r.width), y: (p.clientY - r.top) * (canvas.height / r.height) }; }
  function start(e) { drawing = true; hasStroke = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
  function move(e) { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
  function end() { drawing = false; }
  ['mousedown', 'touchstart'].forEach(ev => canvas.addEventListener(ev, start));
  ['mousemove', 'touchmove'].forEach(ev => canvas.addEventListener(ev, move));
  ['mouseup', 'mouseleave', 'touchend'].forEach(ev => canvas.addEventListener(ev, end));
  padArea.querySelector('[data-role=clear]').addEventListener('click', () => { ctx.clearRect(0, 0, canvas.width, canvas.height); hasStroke = false; });

  const applyBtn = padArea.querySelector('[data-role=apply]');
  withBusyButton(applyBtn, 'Signing…', async () => {
    if (!hasStroke) { toast('Draw a signature first', 'error'); applyBtn.disabled = false; return; }
    const PDFLib = await getPdfLib();
    const pageNum = Math.max(1, parseInt(padArea.querySelector('[data-role=page]').value, 10) || 1);
    const posMode = padArea.querySelector('[data-role=pos]').value;
    const sigBlob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    const sigBytes = new Uint8Array(await sigBlob.arrayBuffer());
    const bytes = await readAsArrayBuffer(file);
    const doc = await PDFLib.PDFDocument.load(bytes);
    const sigImg = await doc.embedPng(sigBytes);
    const pages = doc.getPages();
    const p = pages[Math.min(pageNum, pages.length) - 1];
    const { width, height } = p.getSize();
    const sigW = Math.min(180, width * 0.35);
    const sigH = sigW * (sigImg.height / sigImg.width);
    let x = 40, y = 40;
    if (posMode.includes('right')) x = width - sigW - 40;
    if (posMode.includes('center')) x = width / 2 - sigW / 2;
    p.drawImage(sigImg, { x, y, width: sigW, height: sigH });
    const out = await doc.save();
    downloadBlob(new Blob([out], { type: 'application/pdf' }), `signed-${file.name}`);
    await DB.log('pdf-sign', 'sign');
    toast('Signed PDF downloaded', 'success');
    applyBtn.disabled = false;
  });
}

/* ========================================================= pdf-redact */
async function toolRedact(body) {
  let file = null, pdfjsDoc = null, lastActivePage = null;
  const pages = []; // { boxes: [{x,y,w,h} in canvas px], canvas }
  const dz = makeDropzone({ accept: '.pdf', multiple: false, hint: 'Drop a PDF to redact', onFiles: async (fs) => { file = fs[0]; await load(); } });
  body.append(dz);

  toolbar.innerHTML = `<button class="btn sm ghost" data-act="clear">Clear boxes on this page</button><button class="btn sm primary" data-act="save" style="margin-left:auto">Save redacted PDF</button>`;
  const pagesWrap = el('div', { class: 'stack-12 mt-16' });
  body.append(note, toolbar, pagesWrap);

  async function load() {
    const pdfjsLib = await getPdfJs();
    const bytes = await readAsArrayBuffer(file);
    pdfjsDoc = await pdfjsLib.getDocument({ data: bytes }).promise;
    pagesWrap.innerHTML = '';
    for (let i = 1; i <= pdfjsDoc.numPages; i++) {
      const page = await pdfjsDoc.getPage(i);
      const viewport = page.getViewport({ scale: 1.3 });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width; canvas.height = viewport.height;
      canvas.style.cssText = 'width:100%;max-width:640px;border:1px solid var(--border-subtle);border-radius:8px;cursor:crosshair;display:block';
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      const pageData = { boxes: [], canvas, viewport };
      pages.push(pageData);
      wireDrag(canvas, pageData);
      const label = el('div', { class: 'text-sm text-tertiary' }, [`Page ${i}`]);
      pagesWrap.append(label, canvas);
    }
    toolbar.style.display = 'flex';
  }

  function wireDrag(canvas, pageData) {
    const ctx = canvas.getContext('2d');
    let sx, sy, dragging = false;
    function toCanvasXY(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) }; }
    canvas.addEventListener('mousedown', (e) => { const p = toCanvasXY(e); sx = p.x; sy = p.y; dragging = true; lastActivePage = pageData; });
    canvas.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const p = toCanvasXY(e);
      redrawPage(pageData);
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(Math.min(sx, p.x), Math.min(sy, p.y), Math.abs(p.x - sx), Math.abs(p.y - sy));
    });
    canvas.addEventListener('mouseup', (e) => {
      if (!dragging) return;
      dragging = false;
      const p = toCanvasXY(e);
      const box = { x: Math.min(sx, p.x), y: Math.min(sy, p.y), w: Math.abs(p.x - sx), h: Math.abs(p.y - sy) };
      if (box.w > 4 && box.h > 4) pageData.boxes.push(box);
      redrawPage(pageData);
    });
  }
  async function redrawPage(pageData) {
    const page = await pdfjsDoc.getPage(pages.indexOf(pageData) + 1);
    const ctx = pageData.canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport: pageData.viewport }).promise;
    ctx.fillStyle = '#000';
    pageData.boxes.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
  }

  toolbar.querySelector('[data-act=clear]').addEventListener('click', async () => {
    // Clears whichever page the user most recently drew a box on.
    const target = lastActivePage || pages[pages.length - 1];
    if (target) { target.boxes = []; await redrawPage(target); }
  });
  const redactSaveBtn = toolbar.querySelector('[data-act=save]');
  withBusyButton(redactSaveBtn, 'Saving…', async () => {
    const PDFLib = await getPdfLib();
    const out = await PDFLib.PDFDocument.create();
    const progress = makeProgress(body, 'Rebuilding redacted PDF…');
    for (let i = 0; i < pages.length; i++) {
      const blob = await new Promise(res => pages[i].canvas.toBlob(res, 'image/png'));
      const bytes = new Uint8Array(await blob.arrayBuffer());
      const img = await out.embedPng(bytes);
      const p = out.addPage([img.width, img.height]);
      p.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
      progress.set(((i + 1) / pages.length) * 100);
    }
    const bytes = await out.save();
    downloadBlob(new Blob([bytes], { type: 'application/pdf' }), `redacted-${file.name}`);
    progress.remove();
    await DB.log('pdf-redact', 'save');
    toast('Redacted PDF downloaded', 'success');
    redactSaveBtn.disabled = false;
  });
}

/* ========================================================= pdf-compare */
async function toolCompare(body) {
  let fileA = null, fileB = null;
  const row = el('div', { class: 'row' });
  const dzA = makeDropzone({ accept: '.pdf', multiple: false, hint: 'Drop the original PDF', onFiles: (fs) => { fileA = fs[0]; check(); } });
  const dzB = makeDropzone({ accept: '.pdf', multiple: false, hint: 'Drop the revised PDF', onFiles: (fs) => { fileB = fs[0]; check(); } });
  row.append(dzA, dzB);
  const btn = el('button', { class: 'btn primary mt-16', disabled: 'true' }, ['Compare']);
  const out = el('div', { class: 'card mt-16', style: 'font-family:var(--font-mono);font-size:12.5px;white-space:pre-wrap;max-height:520px;overflow:auto' });
  body.append(row, btn, out);
  function check() { btn.disabled = !(fileA && fileB); }
  withBusyButton(btn, 'Comparing…', async () => {
    const pdfjsLib = await getPdfJs();
    async function extractPages(file) {
      const bytes = await readAsArrayBuffer(file);
      const doc = await pdfjsLib.getDocument({ data: bytes }).promise;
      const pageTexts = [];
      for (let i = 1; i <= doc.numPages; i++) {
        const page = await doc.getPage(i);
        const content = await page.getTextContent();
        pageTexts.push(content.items.map(it => it.str).join(' '));
      }
      return pageTexts;
    }
    const [a, b] = await Promise.all([extractPages(fileA), extractPages(fileB)]);
    const maxPages = Math.max(a.length, b.length);
    let html = '';
    for (let i = 0; i < maxPages; i++) {
      const ta = (a[i] || '').split(/\s+/).filter(Boolean);
      const tb = (b[i] || '').split(/\s+/).filter(Boolean);
      if (ta.join(' ') === tb.join(' ')) { html += `<div style="color:var(--text-tertiary)">Page ${i + 1}: identical</div>`; continue; }
      html += `<div style="margin-top:8px"><strong>Page ${i + 1} differs:</strong></div>`;
      html += `<div>${diffWords(ta, tb)}</div>`;
    }
    out.innerHTML = html;
    btn.disabled = false;
  });
  // Real word-level diff via longest-common-subsequence alignment, not a
  // naive index-by-index comparison. A naive comparison makes a single
  // inserted/removed word near the start of a page cascade into every
  // later word on that page falsely showing as "changed" — LCS alignment
  // finds the actual matching words wherever they land and reports only
  // the genuine insertions/removals, the same approach real diff tools use.
  function diffWords(a, b) {
    const n = a.length, m = b.length;
    // Guard against the O(n*m) table blowing up on an unusually dense page
    // (rare, but a page of run-on text with no whitespace breaks could
    // produce thousands of "words") — fall back to a simple side-by-side
    // note rather than freezing the tab.
    if (n * m > 2_000_000) {
      return `<span class="text-tertiary">This page has too much text to diff word-by-word in the browser — showing full text of both sides instead.</span><br><br><strong>Original:</strong><br>${esc(a.join(' '))}<br><br><strong>Revised:</strong><br>${esc(b.join(' '))}`;
    }
    const dp = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) {
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
    let html = ''; let i = 0, j = 0;
    while (i < n && j < m) {
      if (a[i] === b[j]) { html += `${esc(a[i])} `; i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { html += `<span style="background:var(--danger-soft);color:var(--danger)">-${esc(a[i])}</span> `; i++; }
      else { html += `<span style="background:var(--success-soft);color:var(--success)">+${esc(b[j])}</span> `; j++; }
    }
    while (i < n) { html += `<span style="background:var(--danger-soft);color:var(--danger)">-${esc(a[i])}</span> `; i++; }
    while (j < m) { html += `<span style="background:var(--success-soft);color:var(--success)">+${esc(b[j])}</span> `; j++; }
    return html;
  }
  function esc(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
}

/* ========================================================= pdf-to-word / html / markdown */
// Extract per-page lines of text from a PDF. Pages with little or no
// embedded text (scanned pages, or PDFs made entirely of rendered page
// images — including PDFs produced by this app's own Word → PDF tool,
// which has no text layer at all) are automatically read with on-device
// OCR instead of coming back blank, when an OCR language is supplied.
async function extractStructuredText(pdfjsDoc, options = {}) {
  const { ocrLang = null, getOcrWorker = null, onProgress = null } = options;
  const pages = [];
  for (let i = 1; i <= pdfjsDoc.numPages; i++) {
    const page = await pdfjsDoc.getPage(i);
    const content = await page.getTextContent();
    const lines = [];
    let currentY = null, currentLine = [];
    content.items.forEach(item => {
      const y = Math.round(item.transform[5]);
      if (currentY === null || Math.abs(y - currentY) > 3) {
        if (currentLine.length) lines.push(currentLine.join(' '));
        currentLine = [item.str];
        currentY = y;
      } else {
        currentLine.push(item.str);
      }
    });
    if (currentLine.length) lines.push(currentLine.join(' '));
    let pageLines = lines.filter(l => l.trim());

    const totalChars = pageLines.join('').trim().length;
    if (totalChars < 4 && ocrLang && getOcrWorker) {
      const worker = await getOcrWorker();
      const canvas = await renderPageForOcr(page);
      const { data } = await worker.recognize(canvas);
      pageLines = data.text.split('\n').map((l) => l.trim()).filter(Boolean);
    }

    pages.push(pageLines);
    if (onProgress) onProgress((i / pdfjsDoc.numPages) * 100);
  }
  return pages;
}

function makeOcrFallbackField(body) {
  const langField = el('div', { class: 'field' });
  langField.innerHTML = `<label>OCR language (used only for pages with no embedded text, e.g. scans)</label>
    <select data-role="lang">
      <option value="eng">English</option><option value="hin">Hindi</option><option value="fra">French</option>
      <option value="deu">German</option><option value="spa">Spanish</option><option value="ara">Arabic</option>
      <option value="chi_sim">Chinese (Simplified)</option><option value="jpn">Japanese</option>
    </select>`;
  body.append(langField);
  return () => langField.querySelector('[data-role=lang]').value;
}

// Extract each page as a list of lines, each line as a list of styled runs
// (text + bold/italic/font-size), instead of flattening everything to
// plain text. getTextContent() alone can't tell bold/italic apart — every
// font's CSS fallback comes back as generic "sans-serif" — but pdf.js
// *does* resolve the real per-font metadata (including reliable bold/
// italic flags) into page.commonObjs once a page's operators are parsed,
// so we look font info up from there instead. Falls back to on-device OCR
// (plain, unstyled text) for pages with no real text layer at all, same
// as before.
async function extractFormattedPages(pdfjsDoc, options = {}) {
  const { ocrLang = null, getOcrWorker = null, onProgress = null } = options;
  const pages = [];
  for (let i = 1; i <= pdfjsDoc.numPages; i++) {
    const page = await pdfjsDoc.getPage(i);
    await page.getOperatorList(); // ensures fonts are resolved into commonObjs before we read them
    const content = await page.getTextContent();

    const fontCache = {};
    const getFontInfo = async (fontName) => {
      if (fontCache[fontName]) return fontCache[fontName];
      const info = await new Promise((resolve) => {
        try { page.commonObjs.get(fontName, resolve); } catch (e) { resolve(null); }
      });
      const result = { bold: !!(info && info.bold), italic: !!(info && info.italic) };
      fontCache[fontName] = result;
      return result;
    };

    const rawLines = [];
    let currentY = null, currentItems = [];
    content.items.forEach((item) => {
      if (!item.str) return;
      const y = Math.round(item.transform[5]);
      if (currentY === null || Math.abs(y - currentY) > 3) {
        if (currentItems.length) rawLines.push({ y: currentY, items: currentItems });
        currentItems = [item];
        currentY = y;
      } else {
        currentItems.push(item);
      }
    });
    if (currentItems.length) rawLines.push({ y: currentY, items: currentItems });
    rawLines.sort((a, b) => b.y - a.y); // PDF y grows upward; render top-to-bottom

    const lines = [];
    for (const rl of rawLines) {
      const runs = [];
      for (const item of rl.items) {
        const fontInfo = await getFontInfo(item.fontName);
        const sizePt = Math.round(Math.hypot(item.transform[0], item.transform[1])) || Math.round(item.height) || 12;
        const last = runs[runs.length - 1];
        // Merge consecutive items that share the same style into one run
        // rather than creating a separate TextRun per PDF text fragment.
        if (last && last.bold === fontInfo.bold && last.italic === fontInfo.italic && last.sizePt === sizePt) {
          last.text += item.str;
        } else {
          runs.push({ text: item.str, bold: fontInfo.bold, italic: fontInfo.italic, sizePt });
        }
      }
      if (runs.some((r) => r.text.trim())) lines.push(runs);
    }

    if (!lines.length && ocrLang && getOcrWorker) {
      const worker = await getOcrWorker();
      const canvas = await renderPageForOcr(page);
      const { data } = await worker.recognize(canvas);
      data.text.split('\n').map((l) => l.trim()).filter(Boolean).forEach((l) => {
        lines.push([{ text: l, bold: false, italic: false, sizePt: 12 }]);
      });
    }

    pages.push(lines);
    if (onProgress) onProgress((i / pdfjsDoc.numPages) * 100);
  }
  return pages;
}

async function toolToWord(body) {
  body.append(el('div', { class: 'text-sm text-tertiary mb-8' }, ['Reflows extracted text into paragraphs, preserving bold, italic, and relative heading sizes from the original PDF — exact visual layout (columns, precise spacing, images) is not reproduced, but the text and its formatting are. Pages with no embedded text (scanned pages, or image-only PDFs) are automatically read with on-device OCR.']));
  const getLang = makeOcrFallbackField(body);
  makeStagedFileTool(body, {
    accept: '.pdf', hint: 'Drop PDFs to convert to editable Word documents', buttonLabel: (n) => `Convert ${n} file${n === 1 ? '' : 's'} to Word`,
    run: async (files, holder) => {
      const pdfjsLib = await getPdfJs();
      const docxLib = await getDocxLib();
      const lang = getLang();
      const getOcrWorker = makeOcrWorkerPool(lang, Math.min(2, files.length));
      const jobs = files.map((f, idx) => ({
        id: `w2w${idx}`, label: `${f.name.replace(/\.pdf$/i, '')}.docx`,
        run: async (onProgress) => {
          const bytes = await readAsArrayBuffer(f);
          const doc = await pdfjsLib.getDocument({ data: bytes }).promise;
          const pages = await extractFormattedPages(doc, { ocrLang: lang, getOcrWorker, onProgress });

          // Body font size = the size most of the document's actual text
          // is set in (weighted by character count, not just line count),
          // used as the baseline for deciding which lines read as headings.
          const sizeCounts = {};
          pages.forEach((lines) => lines.forEach((runs) => runs.forEach((r) => {
            const n = r.text.trim().length;
            if (n) sizeCounts[r.sizePt] = (sizeCounts[r.sizePt] || 0) + n;
          })));
          let bodySize = 12, bestCount = 0;
          Object.entries(sizeCounts).forEach(([sz, cnt]) => { if (cnt > bestCount) { bestCount = cnt; bodySize = Number(sz); } });

          const paragraphs = [];
          pages.forEach((lines, pi) => {
            if (pi > 0) paragraphs.push(new docxLib.Paragraph({ children: [new docxLib.PageBreak()] }));
            lines.forEach((runs) => {
              const maxSize = Math.max(...runs.map((r) => r.sizePt));
              const isHeading = maxSize >= bodySize * 1.4;
              const isSubHeading = !isHeading && maxSize >= bodySize * 1.15;
              const children = runs.filter((r) => r.text.length).map((r) => new docxLib.TextRun({
                text: r.text,
                bold: r.bold || isHeading || isSubHeading,
                italics: r.italic,
                size: (isHeading ? Math.max(maxSize, bodySize * 1.5) : isSubHeading ? Math.max(maxSize, bodySize * 1.2) : r.sizePt) * 2,
              }));
              if (children.length) paragraphs.push(new docxLib.Paragraph({ children, spacing: { after: 100 } }));
            });
          });

          const outDoc = new docxLib.Document({ sections: [{ children: paragraphs.length ? paragraphs : [new docxLib.Paragraph('')] }] });
          const blob = await docxLib.Packer.toBlob(outDoc);
          return blob;
        },
      }));
      renderBatchQueue(holder, jobs, { toolId: 'pdf-to-word', zipName: 'converted-word.zip', title: 'PDF → Word queue', onComplete: () => getOcrWorker.terminateAll() });
    },
  });
}

async function toolToHtml(body) {
  function escapeHtml(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
  const getLang = makeOcrFallbackField(body);
  makeStagedFileTool(body, {
    accept: '.pdf', hint: 'Drop PDFs to convert to HTML', buttonLabel: (n) => `Convert ${n} file${n === 1 ? '' : 's'} to HTML`,
    run: async (files, holder) => {
      const pdfjsLib = await getPdfJs();
      const lang = getLang();
      const getOcrWorker = makeOcrWorkerPool(lang, Math.min(2, files.length));
      const jobs = files.map((f, idx) => ({
        id: `w2h${idx}`, label: `${f.name.replace(/\.pdf$/i, '')}.html`,
        run: async (onProgress) => {
          const bytes = await readAsArrayBuffer(f);
          const doc = await pdfjsLib.getDocument({ data: bytes }).promise;
          const pages = await extractStructuredText(doc, { ocrLang: lang, getOcrWorker, onProgress });
          const body2 = pages.map((lines, i) => `<section class="page" data-page="${i + 1}">\n${lines.map(l => `<p>${escapeHtml(l)}</p>`).join('\n')}\n</section>`).join('\n<hr>\n');
          const html = `<!DOCTYPE html>\n<html><head><meta charset="UTF-8"><title>${f.name}</title><style>body{font-family:Georgia,serif;max-width:760px;margin:40px auto;line-height:1.6} .page{margin-bottom:2em} hr{border:none;border-top:1px dashed #ccc;margin:2em 0}</style></head><body>\n${body2}\n</body></html>`;
          return new Blob([html], { type: 'text/html' });
        },
      }));
      renderBatchQueue(holder, jobs, { toolId: 'pdf-to-html', zipName: 'converted-html.zip', title: 'PDF → HTML queue', onComplete: () => getOcrWorker.terminateAll() });
    },
  });
}

async function toolToMarkdown(body) {
  const getLang = makeOcrFallbackField(body);
  makeStagedFileTool(body, {
    accept: '.pdf', hint: 'Drop PDFs to convert to Markdown', buttonLabel: (n) => `Convert ${n} file${n === 1 ? '' : 's'} to Markdown`,
    run: async (files, holder) => {
      const pdfjsLib = await getPdfJs();
      const lang = getLang();
      const getOcrWorker = makeOcrWorkerPool(lang, Math.min(2, files.length));
      const jobs = files.map((f, idx) => ({
        id: `w2m${idx}`, label: `${f.name.replace(/\.pdf$/i, '')}.md`,
        run: async (onProgress) => {
          const bytes = await readAsArrayBuffer(f);
          const doc = await pdfjsLib.getDocument({ data: bytes }).promise;
          const pages = await extractStructuredText(doc, { ocrLang: lang, getOcrWorker, onProgress });
          const md = pages.map((lines, i) => `<!-- Page ${i + 1} -->\n\n` + lines.map(l => {
            // Heuristic: short, standalone, title-cased lines read as headings.
            if (l.length < 70 && /^[A-Z0-9][^.!?]*$/.test(l.trim()) && l.trim().split(' ').length < 10) return `## ${l.trim()}`;
            return l;
          }).join('\n\n')).join('\n\n---\n\n');
          return new Blob([md], { type: 'text/markdown' });
        },
      }));
      renderBatchQueue(holder, jobs, { toolId: 'pdf-to-markdown', zipName: 'converted-markdown.zip', title: 'PDF → Markdown queue', onComplete: () => getOcrWorker.terminateAll() });
    },
  });
}

const MOD_IMAGE = (function() {
const icon = UI.icon;
const toast = UI.toast;
const makeDropzone = UI.makeDropzone;
const makeFileListPanel = UI.makeFileListPanel;
const downloadBlob = UI.downloadBlob;
const el = UI.el;

/**
 * image.js — Image Workspace. Pure Canvas 2D (no external lib needed for
 * the core raster ops — keeps this module dependency-free and instant).

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error(`"${file.name}" couldn't be read as an image — it may be corrupted or an unsupported format.`));
    img.src = URL.createObjectURL(file);
  });
}
function canvasFrom(img, w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  return c;
}
function toBlob(canvas, mime = 'image/png', quality = 0.92) {
  return new Promise(res => canvas.toBlob(res, mime, quality));
}
function extFor(mime) { return { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp', 'image/bmp': 'bmp' }[mime] || 'png'; }

/** Real uncompressed 24-bit BMP encoder (BITMAPFILEHEADER + BITMAPINFOHEADER,
 * bottom-up rows, 4-byte row padding). canvas.toBlob() has no 'image/bmp'
 * support in any browser, so a .bmp download previously silently contained
 * PNG bytes — files with the wrong internal format for their extension,
 * which strict BMP-only readers reject. */
function canvasToBmpBlob(canvas) {
  const w = canvas.width, h = canvas.height;
  const imgData = canvas.getContext('2d').getImageData(0, 0, w, h).data;
  const rowSize = Math.floor((24 * w + 31) / 32) * 4;
  const pixelArraySize = rowSize * h;
  const fileSize = 54 + pixelArraySize;
  const buf = new ArrayBuffer(fileSize);
  const dv = new DataView(buf);
  dv.setUint8(0, 0x42); dv.setUint8(1, 0x4D); // 'BM'
  dv.setUint32(2, fileSize, true);
  dv.setUint32(10, 54, true); // pixel array offset
  dv.setUint32(14, 40, true); // DIB header size
  dv.setInt32(18, w, true);
  dv.setInt32(22, h, true); // positive height = bottom-up
  dv.setUint16(26, 1, true); // color planes
  dv.setUint16(28, 24, true); // bits per pixel
  dv.setUint32(34, pixelArraySize, true);
  dv.setInt32(38, 2835, true); // ~72 DPI
  dv.setInt32(42, 2835, true);
  const bytes = new Uint8Array(buf);
  let offset = 54;
  for (let y = h - 1; y >= 0; y--) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      bytes[offset++] = imgData[i + 2]; bytes[offset++] = imgData[i + 1]; bytes[offset++] = imgData[i];
    }
    offset += rowSize - w * 3; // row padding to a 4-byte boundary
  }
  return new Blob([buf], { type: 'image/bmp' });
}
