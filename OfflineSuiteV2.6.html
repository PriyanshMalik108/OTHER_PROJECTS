/* =========================================================================
   OFFLINE SUITE — DESIGN SYSTEM
   Token-driven, dark/light via [data-theme], dense "pro desktop tool" feel
   (inspired by the information density of Linear / Affinity / VS Code —
   not a marketing site, a workbench).
   ========================================================================= */

:root {
  /* ---- Brand & semantic palette (light) ---- */
  --bg-canvas:      #F6F7F5;
  --bg-surface:     #FFFFFF;
  --bg-raised:      #FFFFFF;
  --bg-sunken:      #EEF0ED;
  --bg-hover:       #E9EBE7;
  --border-subtle:  #DEE1DC;
  --border-strong:  #C6CAC3;

  --text-primary:   #141713;
  --text-secondary: #565B54;
  --text-tertiary:  #72776E;
  --text-inverse:   #FFFFFF;

  --accent:         #1F6F5C;   /* deep pine — "verified/processed" green, not templated teal */
  --accent-strong:  #14513F;
  --accent-soft:    #E4F0EC;
  --accent-contrast:#FFFFFF;

  --warn:           #B4590A;
  --warn-soft:      #FBEBDD;
  --danger:         #B23A3A;
  --danger-soft:    #FBE8E8;
  --success:        #2E7D4F;
  --success-soft:   #E6F4EA;

  --focus-ring:      #1F6F5C;

  /* ---- Typography ---- */
  --font-display: 'Fraunces', 'Source Serif 4', Georgia, serif;
  --font-body:    'IBM Plex Sans', 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono:    'IBM Plex Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  /* ---- Scale ---- */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 14px;
  --shadow-sm: 0 1px 2px rgba(20, 23, 19, 0.06);
  --shadow-md: 0 4px 16px rgba(20, 23, 19, 0.10);
  --shadow-lg: 0 12px 32px rgba(20, 23, 19, 0.16);

  --sidebar-w: 248px;
  --topbar-h: 56px;

  color-scheme: light;
}

[data-theme='dark'] {
  --bg-canvas:      #14171A;
  --bg-surface:     #1B1F22;
  --bg-raised:      #21262A;
  --bg-sunken:      #101314;
  --bg-hover:       #262C30;
  --border-subtle:  #2C3236;
  --border-strong:  #3A4146;

  --text-primary:   #EDEFEC;
  --text-secondary: #A9AFA9;
  --text-tertiary:  #828883;
  --text-inverse:   #14171A;

  --accent:         #4FB894;
  --accent-strong:  #6FCFAE;
  --accent-soft:    #16302A;
  --accent-contrast:#0B1210;

  --warn:           #E0964B;
  --warn-soft:      #33261A;
  --danger:         #E07272;
  --danger-soft:    #331E1E;
  --success:        #5FBE87;
  --success-soft:   #16301F;

  --focus-ring: #6FCFAE;
  color-scheme: dark;
}

/* ---------------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg-canvas);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background-color 220ms ease, color 220ms ease;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
p { margin: 0 0 8px; }
a { color: inherit; }

/* Smooth theme switching: every surface fades colors together instead of
   some elements snapping instantly while others (like body) ease in. */
.sidebar, .topbar, .main, .card, .tool-card, .file-chip, .modal-card, .palette,
.toast, .dropzone, .workspace-toolbar, .sidebar-footer, .empty-state,
input, select, textarea, .btn, .nav-item, .icon-btn {
  transition-property: background-color, border-color, color, box-shadow;
  transition-duration: 180ms;
  transition-timing-function: ease;
}
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: var(--radius-sm); }
::selection { background: var(--accent-soft); color: var(--accent-strong); }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

.skip-link {
  position: absolute; left: -9999px; top: 0; z-index: 1000;
  background: var(--accent); color: var(--accent-contrast);
  padding: 10px 16px; border-radius: 0 0 var(--radius-md) 0;
  font-size: 13.5px; font-weight: 600; text-decoration: none;
}
.skip-link:focus { left: 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}
/* Manual override (Settings → Appearance) for people who want reduced
   motion regardless of their OS-level preference, or vice versa — an
   explicit in-app choice, so it takes priority over the media query. */
html[data-reduce-motion='true'] *, html[data-reduce-motion='true'] *::before, html[data-reduce-motion='true'] *::after {
  animation-duration: 0.001ms !important; transition-duration: 0.001ms !important;
}

/* ---------------------------------------------------------------------- App shell */
.app-shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: var(--topbar-h) 1fr;
  grid-template-areas: "sidebar topbar" "sidebar main";
  height: 100vh;
}
@media (max-width: 1180px) and (min-width: 861px) {
  /* Tablet / small-laptop tier: keep the sidebar as a real sidebar (not
     an overlay drawer — there's enough width for it), just narrower, so
     tool grids get more breathing room instead of jumping straight from
     "full 248px sidebar" to "fully hidden" at the mobile breakpoint. */
  :root { --sidebar-w: 208px; }
  .main { padding: 22px 20px 48px; }
}
@media (max-width: 860px) {
  .app-shell { grid-template-columns: 0 1fr; }
  /* The sidebar itself never had an off-canvas position defined here —
     only `.sidebar.open` set a transform, with no default transform to
     open *from*. A grid item also doesn't shrink below its content's
     natural width just because its track is 0px (grid items default to
     `min-width: auto`), so in practice the sidebar rendered at its full
     width the entire time regardless of the "open" class, permanently
     overlapping the page — toggling "open" changed nothing visible,
     which is why the button looked completely broken. Fixed by giving it
     a real off-canvas position with an explicit closed and open state,
     plus a backdrop so it behaves like a normal mobile drawer. */
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: var(--sidebar-w);
    z-index: 60;
    transform: translateX(-100%);
  }
  .sidebar.open { transform: translateX(0); box-shadow: 16px 0 40px rgba(0,0,0,0.28); }
  .sidebar-backdrop {
    /* display:none/block can't be transitioned at all — the backdrop
       previously just popped in and out with the sidebar's slide
       animating around it, which read as one smooth motion and one
       abrupt one happening together. opacity+visibility can fade the
       same way the sidebar slides, and visibility:hidden (rather than
       display:none) still removes it from the tab order and click
       target when closed. */
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.42);
    z-index: 55;
    opacity: 0;
    visibility: hidden;
    transition: opacity 220ms ease, visibility 0ms linear 220ms;
  }
  .sidebar-backdrop.open { opacity: 1; visibility: visible; transition: opacity 220ms ease; }

  /* Reclaim screen space on small viewports instead of using the same
     desktop padding everywhere, and size touch targets to the ~44px
     minimum comfortable tap size (34px icon buttons are fine for a mouse
     cursor but tight for a fingertip). */
  .main { padding: 16px 14px 40px; }
  .main-inner { max-width: 100%; }
  .page-title { font-size: 21px; }
  .icon-btn { width: 40px; height: 40px; }
  .search-trigger { max-width: 100%; }
  .search-trigger span:not(.sr-only) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar { padding: 0 10px; gap: 8px; }
  .grid.cols-4, .grid.cols-3, .grid.cols-2 { grid-template-columns: 1fr 1fr; }

  /* A toast anchored to a fixed corner with a 240–360px width either
     hugs one edge awkwardly or nearly spans the screen anyway on a phone
     — stretching it to the full width (minus a margin) both looks more
     intentional and is easier to read one-handed. */
  .toast-region { left: 12px; right: 12px; bottom: 12px; }
  .toast { min-width: 0; max-width: none; width: 100%; }

  /* Same reasoning for the command palette / modals: give them real
     margins instead of relying on 92vw leaving an inconsistent gutter
     across different phone widths, and don't push the palette down by a
     fixed 12vh (that's a lot of dead space above it on a short screen). */
  .overlay { padding-top: 8vh; padding-left: 12px; padding-right: 12px; align-items: flex-start; }
  .palette, .modal-card { width: 100%; max-width: 480px; }
}

/* Sidebar */
.sidebar {
  grid-area: sidebar;
  background: var(--bg-surface);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  /* A later same-specificity `transition:` shorthand fully replaces every
     transition sub-property, not just the one being changed — this was
     silently discarding the shared "smooth theme switching" rule's
     background-color/border-color/color transitions for .sidebar
     specifically, so toggling the theme made the sidebar's background
     snap instantly while every other surface around it faded. Listing all
     the properties together here keeps both the slide animation and the
     theme-color fade working at once. */
  transition: transform 220ms cubic-bezier(0.32, 0.72, 0, 1), background-color 220ms ease, border-color 220ms ease, color 220ms ease;
}
.sidebar-scroll {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
}
.sidebar-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; border-bottom: 1px solid var(--border-subtle);
  font-family: var(--font-display); font-weight: 600; font-size: 16px;
}
.sidebar-brand .mark {
  width: 26px; height: 26px; border-radius: 7px;
  background: linear-gradient(155deg, var(--accent), var(--accent-strong));
  display: grid; place-items: center; color: var(--accent-contrast); font-size: 13px; font-weight: 700;
  flex: none;
}
.sidebar-section { padding: 10px 10px 4px; }
.sidebar-section-title {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-tertiary); padding: 8px 8px 4px; font-weight: 600;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--radius-sm);
  color: var(--text-secondary); text-decoration: none; font-size: 13.5px;
  cursor: pointer; border: none; background: none; width: 100%; text-align: left;
  transition: background 130ms ease, color 130ms ease;
}
.nav-item svg { flex: none; width: 17px; height: 17px; opacity: 0.85; transition: opacity 130ms ease; }
.nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.nav-item:hover svg { opacity: 1; }
.nav-item.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
.nav-item .count {
  margin-left: auto; font-size: 10.5px; color: var(--text-tertiary);
  background: var(--bg-sunken); padding: 1px 6px; border-radius: 10px;
}

/* Sidebar top: creator photo + LinkedIn follow, right under the brand */
.sidebar-top-creator {
  flex: none;
  border-bottom: 1px solid var(--border-subtle);
  padding: 12px 14px;
  background: var(--bg-sunken);
}
.creator-row { display: flex; align-items: center; gap: 10px; }
.creator-avatar {
  flex: none; width: 34px; height: 34px; border-radius: 50%;
  padding: 2px;
  background: linear-gradient(155deg, var(--accent), var(--accent-strong));
  transition: transform 150ms ease;
}
.creator-row:hover .creator-avatar { transform: scale(1.06) rotate(-2deg); }
.creator-avatar img {
  width: 100%; height: 100%; border-radius: 50%; display: block; object-fit: cover;
  border: 1.5px solid var(--bg-sunken);
}
.creator-info { min-width: 0; flex: 1; line-height: 1.25; }
.creator-name { font-size: 12.5px; font-weight: 700; color: var(--text-primary); }
.linkedin-chip {
  flex: none;
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 9px; border-radius: 999px;
  background: #0A66C2; color: #fff;
  text-decoration: none; font-size: 11px; font-weight: 700;
  transition: background 150ms ease, transform 150ms ease;
}
.linkedin-chip:hover { background: #0e7fe8; transform: translateY(-1px); }
.linkedin-chip svg { width: 12.5px; height: 12.5px; flex: none; }

/* Sidebar footer: collaboration contact, pinned below the scrollable nav */
.sidebar-footer {
  flex: none;
  border-top: 1px solid var(--border-subtle);
  padding: 12px 14px;
  background: var(--bg-sunken);
}
.collab-line {
  font-size: 11px; color: var(--text-secondary);
  text-align: center; line-height: 1.4;
}
.collab-line a { color: var(--accent-strong); text-decoration: none; font-weight: 600; }
.collab-line a:hover { text-decoration: underline; }
.creator-copyright {
  margin-top: 8px; font-size: 9.5px; color: var(--text-tertiary);
  text-align: center; letter-spacing: 0.01em;
}

/* Topbar */
.topbar {
  grid-area: topbar;
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px;
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-surface);
}
/* Compound selector (not just .menu-toggle) so this reliably beats
   .icon-btn's own `display: inline-flex` regardless of which rule
   happens to come later in the stylesheet — both are single-class
   selectors of equal specificity, so source order alone previously
   decided the winner, and .icon-btn (defined further down) was
   overriding this and leaving the button visible (and non-functional,
   since the off-canvas layout only exists below the breakpoint) even on
   desktop. */
.icon-btn.menu-toggle { display: none; }
@media (max-width: 860px) { .icon-btn.menu-toggle { display: inline-flex; } }

.search-trigger {
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--border-subtle); background: var(--bg-sunken);
  border-radius: var(--radius-md); padding: 7px 10px; color: var(--text-tertiary);
  font-size: 13px; cursor: pointer; width: 320px; max-width: 40vw;
}
.search-trigger kbd {
  margin-left: auto; font-family: var(--font-mono); font-size: 10.5px;
  background: var(--bg-surface); border: 1px solid var(--border-subtle);
  border-radius: 4px; padding: 1px 5px; color: var(--text-tertiary);
}
.topbar-spacer { flex: 1; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: var(--radius-md);
  border: 1px solid transparent; background: transparent; color: var(--text-secondary);
  cursor: pointer;
  transition: background 130ms ease, color 130ms ease, transform 90ms ease;
}
.icon-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.icon-btn:active { transform: scale(0.92); }
.icon-btn svg { width: 18px; height: 18px; transition: transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1); }
#themeToggle:active svg { transform: rotate(-20deg); }

/* Main */
.main {
  grid-area: main;
  overflow-y: auto;
  padding: 28px 32px 60px;
}
.main-inner { max-width: 1180px; margin: 0 auto; animation: content-in 220ms cubic-bezier(0.2, 0.7, 0.3, 1); }
@keyframes content-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.page-header { margin-bottom: 22px; }
.page-eyebrow {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--accent); font-weight: 700; margin-bottom: 6px;
}
.page-title { font-size: 26px; }
.page-sub { color: var(--text-secondary); max-width: 640px; }

/* Per-tool "How to use this" guide — a native <details> disclosure so it
   needs no extra JS, is keyboard/screen-reader accessible for free, and
   stays out of the way (collapsed) until someone actually wants it. */
.tool-guide {
  margin: 16px 0 22px;
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  background: var(--bg-sunken);
  overflow: hidden;
}
.tool-guide[open] { padding-bottom: 4px; }
.tool-guide summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 14px;
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 600; color: var(--text-primary);
  user-select: none;
}
.tool-guide summary::-webkit-details-marker { display: none; }
.tool-guide summary .chev { margin-left: auto; width: 14px; height: 14px; flex: none; transition: transform 150ms ease; color: var(--text-tertiary); }
.tool-guide[open] summary .chev { transform: rotate(180deg); }
.tool-guide summary .guide-icon { width: 15px; height: 15px; flex: none; color: var(--accent); }
.tool-guide-body { padding: 2px 16px 14px; }
.tool-guide-what { font-size: 13px; color: var(--text-secondary); margin: 0 0 12px; line-height: 1.55; }
.tool-guide-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 620px) { .tool-guide-cols { grid-template-columns: 1fr; } }
.tool-guide-col h4 {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-tertiary); margin: 0 0 6px; font-weight: 700;
}
.tool-guide-col ol, .tool-guide-col ul { margin: 0; padding-left: 18px; }
.tool-guide-col li { font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 3px; }
.tool-guide-col.avoid li::marker { color: var(--warn, #c07a00); }
.tool-guide-notes { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border-subtle, rgba(0,0,0,0.08)); }
.tool-guide-notes h4 {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--text-tertiary); margin: 0 0 8px;
}
.tool-guide-notes ul { margin: 0; padding-left: 18px; }
.tool-guide-notes li { font-size: 12.5px; color: var(--text-secondary); line-height: 1.65; margin-bottom: 6px; }
.tool-guide-notes li strong { color: var(--text-primary); font-weight: 600; }

/* Cards / grid */
.grid { display: grid; gap: 14px; }
.grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
.grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 1000px) { .grid.cols-4 { grid-template-columns: repeat(2, 1fr); } .grid.cols-3 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 620px) { .grid.cols-4, .grid.cols-3, .grid.cols-2 { grid-template-columns: 1fr; } }

.card {
  background: var(--bg-surface); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg); padding: 16px;
}
.tool-card {
  background: var(--bg-surface); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md); padding: 14px;
  cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 8px;
  transition: border-color 120ms ease, transform 120ms ease, box-shadow 120ms ease, background-color 180ms ease, color 180ms ease;
}
.tool-card:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.tool-card .tool-icon {
  width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent-strong);
}
.tool-card .tool-icon svg { width: 18px; height: 18px; }
.tool-card .tool-name { font-weight: 600; font-size: 13.5px; }
.tool-card .tool-desc { font-size: 12px; color: var(--text-tertiary); }
.tool-card .fav-btn {
  margin-left: auto; background: none; border: none; color: var(--text-tertiary); cursor: pointer;
  padding: 2px;
}
.tool-card .fav-btn.active { color: var(--warn); }
.tool-card-top { display: flex; align-items: flex-start; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 7px; justify-content: center;
  padding: 8px 14px; border-radius: var(--radius-md); font-size: 13.5px; font-weight: 600;
  border: 1px solid var(--border-strong); background: var(--bg-surface); color: var(--text-primary);
  cursor: pointer;
  transition: background 130ms ease, border-color 130ms ease, color 130ms ease, transform 90ms ease, box-shadow 130ms ease;
}
.btn:hover { background: var(--bg-hover); }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); box-shadow: 0 2px 10px rgba(31, 111, 92, 0.25); }
.btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--bg-hover); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn svg { width: 15px; height: 15px; }

/* Dropzone */
.dropzone {
  border: 1.5px dashed var(--border-strong); border-radius: var(--radius-lg);
  padding: 40px 20px; text-align: center; color: var(--text-secondary);
  background: var(--bg-sunken); cursor: pointer;
  transition: border-color 150ms ease, background 150ms ease, color 150ms ease, transform 150ms ease;
}
.dropzone.drag-over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); transform: scale(1.01); }
.dropzone input { display: none; }

/* File chips / list */
.file-list { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.file-list-panel {
  margin-top: 14px; padding: 12px; border-radius: var(--radius-md);
  background: var(--bg-sunken); border: 1px solid var(--border-subtle);
}
.file-list-panel-header {
  display: flex; align-items: center; gap: 10px;
  font-size: 12.5px; font-weight: 600; color: var(--text-secondary);
  margin-bottom: 8px;
}
.file-list-panel .file-list { margin-top: 0; }
.file-chip {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; background: var(--bg-surface); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md); font-size: 13px;
  transition: border-color 150ms ease, background-color 150ms ease;
}
.file-chip .file-icon { flex: none; width: 28px; height: 28px; border-radius: 6px; background: var(--bg-sunken); display: grid; place-items: center; }
.file-chip .file-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-chip .file-meta { color: var(--text-tertiary); font-size: 11.5px; }
.file-chip .file-actions { margin-left: auto; display: flex; gap: 4px; }
.file-chip.drag-handle { cursor: grab; }

/* Toolbar (inside a workspace) */
.workspace-toolbar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px 0; border-bottom: 1px solid var(--border-subtle); margin-bottom: 16px;
}
.workspace-toolbar .divider { width: 1px; height: 22px; background: var(--border-subtle); margin: 0 4px; }

/* Progress */
.progress-track { height: 6px; border-radius: 4px; background: var(--bg-sunken); overflow: hidden; position: relative; }
.progress-fill {
  height: 100%; border-radius: 4px;
  background: linear-gradient(90deg, var(--accent), var(--accent-strong));
  transition: width 240ms cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}
/* A soft moving highlight over the fill while work is actively happening
   — a static flat-color bar reads as "stuck" even when it's genuinely
   progressing smoothly; this small bit of motion is what makes a loading
   bar feel alive rather than frozen. */
.progress-fill:not(.done)::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
  animation: progress-shimmer 1.6s ease-in-out infinite;
}
@keyframes progress-shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
.progress-fill.indeterminate {
  width: 40% !important;
  animation: progress-indeterminate 1.4s ease-in-out infinite;
}
@keyframes progress-indeterminate {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(250%); }
}
.progress-card-enter { animation: progress-card-in 200ms ease both; }
@keyframes progress-card-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) {
  .progress-fill:not(.done)::after, .progress-fill.indeterminate, .progress-card-enter { animation: none; }
}

/* Toasts */
.toast-region { position: fixed; bottom: 18px; right: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 900; }
.toast {
  background: var(--bg-raised); border: 1px solid var(--border-subtle); box-shadow: var(--shadow-md);
  border-radius: var(--radius-md); padding: 10px 14px; font-size: 13px; min-width: 240px; max-width: 360px;
  display: flex; align-items: flex-start; gap: 8px;
  animation: toast-in 160ms ease;
}
.toast.success { border-left: 3px solid var(--success); }
.toast.error { border-left: 3px solid var(--danger); }
.toast.warn { border-left: 3px solid var(--warn); }
@keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
/* Dismissal previously called el.remove() with no exit transition at all,
   so every toast — after a nice fade/slide-in — simply vanished mid-frame
   instead of leaving the same way it arrived. This mirrors toast-in in
   reverse so the two feel like a matched pair, not fade-in/hard-cut. */
.toast.toast-leaving { animation: toast-out 160ms ease forwards; }
@keyframes toast-out { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(6px); } }

/* Modal / Command palette */
.overlay {
  position: fixed; inset: 0; background: rgba(10, 12, 10, 0.44);
  display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh;
  z-index: 950;
  animation: overlay-in 140ms ease;
}
@keyframes overlay-in { from { opacity: 0; } to { opacity: 1; } }
/* Same fix as toasts: closing a modal/palette previously yanked the
   overlay out instantly. The palette/modal card gets its own slightly
   snappier reverse of palette-in so the card and its backdrop both feel
   like they're leaving together rather than the card popping off before
   the backdrop has a chance to fade. */
.overlay.overlay-leaving { animation: overlay-out 120ms ease forwards; }
@keyframes overlay-out { from { opacity: 1; } to { opacity: 0; } }
.overlay.overlay-leaving .palette, .overlay.overlay-leaving .modal-card { animation: palette-out 120ms cubic-bezier(0.4, 0, 1, 1) forwards; }
@keyframes palette-out { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-6px) scale(0.98); } }
.palette {
  width: 560px; max-width: 92vw; max-height: 60vh; background: var(--bg-raised);
  border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
  overflow: hidden; display: flex; flex-direction: column;
  animation: palette-in 160ms cubic-bezier(0.2, 0.8, 0.3, 1);
}
@keyframes palette-in { from { opacity: 0; transform: translateY(-8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
.palette-input {
  width: 100%; border: none; border-bottom: 1px solid var(--border-subtle);
  padding: 14px 16px; font-size: 15px; background: transparent; color: var(--text-primary);
}
.palette-input:focus { outline: none; }
.palette-results { overflow-y: auto; padding: 6px; }
.palette-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius-sm);
  cursor: pointer; font-size: 13.5px;
  transition: background 100ms ease, color 100ms ease;
}
.palette-item.active, .palette-item:hover { background: var(--accent-soft); color: var(--accent-strong); }
.palette-item .p-desc { color: var(--text-tertiary); font-size: 11.5px; margin-left: 4px; }

.modal-card {
  width: 480px; max-width: 92vw; background: var(--bg-raised); border-radius: var(--radius-lg);
  border: 1px solid var(--border-subtle); box-shadow: var(--shadow-lg); padding: 20px;
  animation: palette-in 160ms cubic-bezier(0.2, 0.8, 0.3, 1);
}

/* Form controls */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 5px; color: var(--text-secondary); }
.field input[type=text], .field input[type=number], .field input[type=password], .field select, .field textarea {
  width: 100%; padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong);
  background: var(--bg-surface); color: var(--text-primary); font-size: 13.5px; font-family: inherit;
}
.field input[type=range] { width: 100%; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }

/* Badges */
.badge {
  display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 7px; border-radius: 20px;
}
.badge.new { background: var(--accent-soft); color: var(--accent-strong); }
.badge.beta { background: var(--warn-soft); color: var(--warn); }

/* Command palette footer hint */
.palette-footer {
  padding: 8px 14px; border-top: 1px solid var(--border-subtle); font-size: 11px; color: var(--text-tertiary);
  display: flex; gap: 14px;
}
.palette-footer kbd { font-family: var(--font-mono); background: var(--bg-sunken); border-radius: 3px; padding: 1px 5px; }

/* Empty state */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-tertiary); }
.empty-state svg { width: 46px; height: 46px; margin-bottom: 10px; opacity: 0.6; }

/* Utility */
.stack-8 { display: flex; flex-direction: column; gap: 8px; }
.stack-12 { display: flex; flex-direction: column; gap: 12px; }
.text-sm { font-size: 12.5px; }
.text-tertiary { color: var(--text-tertiary); }
.mt-16 { margin-top: 16px; }

/* ===== js/ui.js -> UI ===== */

const UI = (function() {

/**

 * functions that receive a container element and render into it. This
 * keeps the bundle-free architecture viable up to 200+ tools without a
 * build step, while still giving each module a consistent toolkit.
 */

function icon(name) {

    security: '<path d="M12 2l8 4v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V6z"/>',

    settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1h.1a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
    upload: '<path d="M12 16V4M6 10l6-6 6 6"/><path d="M4 20h16"/>',

    trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
    download: '<path d="M12 3v13M6 10l6 6 6-6"/><path d="M4 20h16"/>',
    home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
    batch: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
    drag: '<circle cx="9" cy="6" r="1.2"/><circle cx="9" cy="12" r="1.2"/><circle cx="9" cy="18" r="1.2"/><circle cx="15" cy="6" r="1.2"/><circle cx="15" cy="12" r="1.2"/><circle cx="15" cy="18" r="1.2"/>',

// icon() returns markup as a *string*. That's correct when it's interpolated
// into an innerHTML template, but el()'s children array intentionally
// treats string children as plain text (appended via createTextNode) to
// avoid silently injecting arbitrary HTML wherever a plain label is passed
// — which means passing icon(...) directly into an el() children array
// renders the literal "<svg>...</svg>" text on screen instead of the icon.
// Use this instead in that specific case: it parses the markup once and
// returns the real <svg> element to append, with no wrapper left behind.
function iconEl(name) {
  const holder = document.createElement('span');
  holder.innerHTML = icon(name);
  return holder.firstElementChild;
}

/* ---------------------------------------------------------------- Toasts */
let toastRegion = null;
function toast(message, type = 'success', ms = 3600) {
  if (!toastRegion) {
    toastRegion = document.createElement('div');
    toastRegion.className = 'toast-region';
    toastRegion.setAttribute('role', 'status');
    toastRegion.setAttribute('aria-live', 'polite');
    document.body.appendChild(toastRegion);
  }
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span style="width:16px;flex:none;margin-top:1px">${icon(type === 'error' ? 'x' : type === 'warn' ? 'security' : 'check')}</span><span>${message}</span>`;
  toastRegion.appendChild(el);
  // Play the reverse of toast-in before removing, instead of yanking the
  // element out mid-frame — el.remove() with no exit transition previously
  // made every toast disappear with a hard cut despite fading in smoothly.
  // The 220ms fallback (animation is 160ms) guarantees removal even if
  // 'animationend' never fires for some reason, so a toast can never get
  // stuck on-screen forever.
  setTimeout(() => {
    el.classList.add('toast-leaving');
    let removed = false;
    const doRemove = () => { if (!removed) { removed = true; el.remove(); } };
    el.addEventListener('animationend', doRemove, { once: true });
    setTimeout(doRemove, 220);
  }, ms);
}

/* ---------------------------------------------------------------- Modal */
function openModal(innerHTML, { onMount } = {}) {
  const previouslyFocused = document.activeElement;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true">${innerHTML}</div>`;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  function close() {
    // Same reverse-of-entrance treatment as toast() — play overlay-out /
    // palette-out before detaching, rather than overlay.remove() cutting
    // the modal out instantly with no exit transition.
    overlay.classList.add('overlay-leaving');
    document.removeEventListener('keydown', onKey);
    if (previouslyFocused && document.contains(previouslyFocused)) previouslyFocused.focus();
    let removed = false;
    const doRemove = () => { if (!removed) { removed = true; overlay.remove(); } };
    overlay.addEventListener('animationend', doRemove, { once: true });
    setTimeout(doRemove, 180);
  }
  function onKey(e) { if (e.key === 'Escape') close(); }
  document.addEventListener('keydown', onKey);
  document.body.appendChild(overlay);
  if (onMount) onMount(overlay, close);
  return close;
}

/* ---------------------------------------------------------------- Progress */
function makeProgress(container, label = 'Processing…') {
  const wrap = document.createElement('div');
  wrap.className = 'card stack-8 progress-card-enter';
  wrap.innerHTML = `
    <div style="display:flex;justify-content:space-between;font-size:12.5px">
      <span class="p-label">${label}</span><span class="p-pct text-tertiary">0%</span>
    </div>
    <div class="progress-track"><div class="progress-fill indeterminate" style="width:0%"></div></div>`;
  container.appendChild(wrap);
  return {
    // Call with a percentage once real progress is known — this also
    // switches the bar out of its initial indeterminate (unknown-length)
    // animation into a normal determinate fill.
    set(pct, newLabel) {
      const fill = wrap.querySelector('.progress-fill');
      fill.classList.remove('indeterminate');
      const clamped = Math.max(0, Math.min(100, pct));
      fill.style.width = `${clamped}%`;
      fill.classList.toggle('done', clamped >= 100);
      wrap.querySelector('.p-pct').textContent = `${Math.round(clamped)}%`;
      if (newLabel) wrap.querySelector('.p-label').textContent = newLabel;
    },
    // For steps with no meaningful percentage to report — keeps the bar
    // visibly active instead of sitting at a misleading fixed number.
    indeterminate(newLabel) {
      const fill = wrap.querySelector('.progress-fill');
      fill.classList.add('indeterminate');
      wrap.querySelector('.p-pct').textContent = '';
      if (newLabel) wrap.querySelector('.p-label').textContent = newLabel;
    },
    remove() { wrap.remove(); },
    el: wrap,
  };
}

/* ---------------------------------------------------------------- Dropzone */
/**
 * Creates a drag/drop + click-to-browse file input.
 * onFiles receives a File[] array.
 */
/**
 * Checks a File against an `accept` pattern (the same mini-language used by
 * <input accept="...">): comma-separated list of file extensions (.pdf),
 * MIME types (image/png), or MIME wildcards (image/*). Returns true if the
 * file matches, or if accept is '*' / empty (no restriction).
 */
function fileMatchesAccept(file, accept) {
  if (!accept || accept === '*') return true;
  const patterns = accept.split(',').map(p => p.trim()).filter(Boolean);
  if (!patterns.length) return true;
  const name = file.name.toLowerCase();
  const type = (file.type || '').toLowerCase();
  return patterns.some(p => {
    const pl = p.toLowerCase();
    if (pl.startsWith('.')) return name.endsWith(pl);
    if (pl.endsWith('/*')) return type.startsWith(pl.slice(0, -1));
    return type === pl;
  });
}

/**
 * Filters a raw file list down to valid, non-empty files matching `accept`,
 * showing a clear toast for anything rejected. This is what actually closes
 * the gap: browsers only enforce `accept` on the native file-picker dialog —
 * drag-and-drop bypasses it completely, so without this check a dropzone
 * declared accept=".pdf" would silently accept a dropped .exe or .jpg.
 */
function validateFiles(rawFiles, accept) {
  const valid = [];
  const rejectedType = [];
  const rejectedEmpty = [];
  rawFiles.forEach(f => {
    if (f.size === 0) { rejectedEmpty.push(f.name); return; }
    if (!fileMatchesAccept(f, accept)) { rejectedType.push(f.name); return; }
    valid.push(f);
  });
  if (rejectedType.length) {
    toast(`${rejectedType.length === 1 ? `"${rejectedType[0]}" isn't` : `${rejectedType.length} files aren't`} a supported file type for this tool.`, 'error');
  }
  if (rejectedEmpty.length) {
    toast(`${rejectedEmpty.length === 1 ? `"${rejectedEmpty[0]}" is` : `${rejectedEmpty.length} files are`} empty (0 bytes) and can't be processed.`, 'error');
  }
  return valid;
}

function makeDropzone({ accept = '*', multiple = true, hint = 'Drag & drop files here, or click to browse', onFiles }) {
  const zone = document.createElement('div');
  zone.className = 'dropzone';
  zone.tabIndex = 0;
  zone.setAttribute('role', 'button');
  zone.setAttribute('aria-label', 'Upload files');
  zone.innerHTML = `
    <div style="width:34px;height:34px;margin:0 auto 10px;color:var(--accent)">${icon('upload')}</div>
    <div style="font-weight:600;color:var(--text-primary);margin-bottom:2px">${hint}</div>
    <div class="text-sm text-tertiary">Files never leave this device</div>
    <input type="file" accept="${accept}" ${multiple ? 'multiple' : ''}>`;
  const input = zone.querySelector('input');
  zone.addEventListener('click', () => input.click());
  zone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
  input.addEventListener('change', () => {
    const valid = validateFiles(Array.from(input.files), accept);
    if (valid.length) onFiles(multiple ? valid : valid.slice(0, 1));
    input.value = '';
  });
  ['dragenter', 'dragover'].forEach(evt => zone.addEventListener(evt, (e) => { e.preventDefault(); zone.classList.add('drag-over'); }));
  ['dragleave', 'drop'].forEach(evt => zone.addEventListener(evt, (e) => { e.preventDefault(); zone.classList.remove('drag-over'); }));
  zone.addEventListener('drop', (e) => {
    const raw = Array.from(e.dataTransfer.files || []);
    if (!raw.length) return;
    const valid = validateFiles(raw, accept);
    if (valid.length) onFiles(multiple ? valid : valid.slice(0, 1));
  });
  return zone;
}

/* ---------------------------------------------------------------- helpers */
function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  });
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null) return;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
}

/* ---------------------------------------------------------------- Staged batch tool */
/**
 * Wires up the standard "drop files → review/remove in a list → click a
 * button to run" flow used across the app's batch tools. Centralizing this
 * ensures every multi-file tool gives the user a chance to see and remove
 * a wrongly-added file before anything actually runs, instead of some
 * tools firing immediately on drop with no staging step at all.
 *
 * @param {HTMLElement} body - container to render into
 * @param {object} opts
 * @param {string} opts.accept - dropzone accept filter
 * @param {string} opts.hint - dropzone hint text
 * @param {(count: number) => string} [opts.buttonLabel] - button text, given the current file count
 * @param {(files: File[], holder: HTMLElement) => void} opts.run - called once, with the staged files, when the button is clicked
 */
// Lets one tool hand its already-selected files off to another tool it
// redirects to (e.g. "Bulk PDF conversion" picks a target tool and sends
// you there) instead of just navigating away and silently discarding
// whatever the user had already selected, forcing them to re-pick every
// file from scratch. Whichever staged-file tool loads next automatically
// picks this up once, then clears it.
window.__pendingFileHandoff = null;

function makeStagedFileTool(body, { accept, hint, buttonLabel = (n) => `Run (${n} file${n === 1 ? '' : 's'})`, run }) {
  let files = [];
  const listPanel = makeFileListPanel({ onChange: (updated) => { files = updated; syncBtn(); } });
  const dz = makeDropzone({ accept, multiple: true, hint, onFiles: (fs) => { files = files.concat(fs); listPanel.setFiles(files); syncBtn(); } });
  const holder = el('div');
  const btn = el('button', { class: 'btn primary mt-16', disabled: 'true' });
  body.append(dz, listPanel.el, btn, holder);
  function syncBtn() { btn.disabled = files.length === 0; btn.textContent = buttonLabel(files.length); }
  syncBtn();
  btn.addEventListener('click', () => {
    const current = files;
    btn.remove();
    listPanel.setFiles([]);
    files = [];
    run(current, holder);
  });

  if (window.__pendingFileHandoff && window.__pendingFileHandoff.length) {
    files = window.__pendingFileHandoff;
    window.__pendingFileHandoff = null;
    listPanel.setFiles(files);
    syncBtn();
    toast(`Carried over ${files.length} file${files.length === 1 ? '' : 's'} from the previous tool`, 'success');
  }
}

/* ---------------------------------------------------------------- Editable file list */
/**
 * A reusable "selected files" panel: shows each file with its size, a
 * remove (×) button per file, a running total, and a "Clear all" button.
 * This is the fix for tools that accumulated files with no way to see or
 * remove a selection short of reloading the page.
 *
 * @param {object} opts
 * @param {(files: File[]) => void} opts.onChange - called with the updated
 *   file array whenever the user removes one file or clears all.
 * @returns {{ el: HTMLElement, setFiles(files: File[]): void, getFiles(): File[] }}
 */
function makeFileListPanel({ onChange } = {}) {
  let files = [];
  const wrap = document.createElement('div');
  wrap.className = 'file-list-panel';

  function render() {
    if (!files.length) { wrap.innerHTML = ''; wrap.style.display = 'none'; return; }
    wrap.style.display = 'block';
    const totalSize = files.reduce((a, f) => a + f.size, 0);
    wrap.innerHTML = `
      <div class="file-list-panel-header">
        <span>${files.length} file${files.length === 1 ? '' : 's'} selected</span>
        <span class="text-tertiary">${formatBytes(totalSize)}</span>
        <button class="btn ghost sm" data-act="clear-all" style="margin-left:auto">${icon('trash')} Clear all</button>
      </div>
      <div class="file-list" data-role="items"></div>`;
    const itemsEl = wrap.querySelector('[data-role=items]');
    files.forEach((f, i) => {
      const row = document.createElement('div');
      row.className = 'file-chip';
      row.innerHTML = `
        <div class="file-icon">${icon('file')}</div>
        <div style="flex:1;min-width:0">
          <div class="file-name">${escapeHtml(f.name)}</div>
          <div class="file-meta">${formatBytes(f.size)}</div>
        </div>
        <button class="btn ghost sm" data-act="remove" aria-label="Remove ${escapeHtml(f.name)}">${icon('x')}</button>`;
      row.querySelector('[data-act=remove]').addEventListener('click', () => {
        files = files.slice(0, i).concat(files.slice(i + 1));
        render();
        onChange?.(files);
      });
      itemsEl.appendChild(row);
    });
    wrap.querySelector('[data-act=clear-all]').addEventListener('click', () => {
      files = [];
      render();
      onChange?.(files);
    });
  }

  render();
  return {
    el: wrap,
    setFiles(newFiles) { files = newFiles.slice(); render(); },
    getFiles() { return files.slice(); },
  };
}

/* ---------------------------------------------------------------- Security: HTML escaping */
/**
 * Escapes a string for safe interpolation into innerHTML. File names,
 * user-typed text, and anything else that isn't a value this codebase
 * generated itself MUST go through this before landing in an innerHTML
 * template string — a maliciously-named file (e.g. one shared by someone
 * else, not just self-inflicted) can otherwise inject a script via its
 * filename the moment its name is displayed anywhere in the UI.
 */
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

/**
 * Wraps a button's click handler so it can never be double-fired while its
 * async work is in flight (a real gap: several tools showed a progress bar
 * but left the triggering button clickable, so a second click could start a
 * duplicate/racing operation), and always shows a clear busy state.
 * Restoration happens in `finally`, so it can't get stuck disabled forever
 * even if the handler throws.
 */
function withBusyButton(btn, busyLabel, handler) {
  const originalHTML = btn.innerHTML;
  btn.addEventListener('click', async () => {
    if (btn.disabled) return;
    btn.disabled = true;
    btn.innerHTML = busyLabel;
    try {
      await handler();
      // Success: restore the label. Leave `disabled` as whatever the
      // handler itself left it — most tools want it re-enabled for another
      // run, but some (e.g. a tool that clears its file selection after
      // success) deliberately set it back to disabled as their own last
      // action, and that intent should win over a blanket reset here.
      btn.innerHTML = originalHTML;
    } catch (err) {
      // Error: always recover so a failure can never leave the button
      // stuck disabled with no way to retry.
      btn.innerHTML = originalHTML;
      btn.disabled = false;
      throw err;
    }
  });
}

function formatBytes(bytes) {
  if (bytes === 0) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(1024));
  return `${(bytes / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
}

// Human-friendly relative timestamps ("just now", "5 min ago", "yesterday")
// for the recent-activity feed and anywhere else a raw Date would be noise.
function formatRelativeTime(ts) {
  const diffMs = Date.now() - ts;
  const sec = Math.floor(diffMs / 1000);
  if (sec < 10) return 'just now';
  if (sec < 60) return `${sec}s ago`;
  const min = Math.floor(sec / 60);
  if (min < 60) return `${min} min${min === 1 ? '' : 's'} ago`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr} hour${hr === 1 ? '' : 's'} ago`;
  const day = Math.floor(hr / 24);
  if (day === 1) return 'yesterday';
  if (day < 7) return `${day} days ago`;
  return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: new Date(ts).getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
return { icon, iconEl, toast, openModal, makeProgress, makeDropzone, el, makeFileListPanel, makeStagedFileTool, escapeHtml, withBusyButton, formatBytes, formatRelativeTime, downloadBlob };
})();


/* ===== js/db.js -> DB ===== */

const DB = (function() {

/**
 * db.js — thin IndexedDB wrapper.
 *
 * Stores (object stores), all local, nothing ever leaves the device:
 *   - kv          : generic key/value (settings, theme, last-used tool, autosave prefs)
 *   - favorites   : { toolId, addedAt }
 *   - recents     : { toolId, usedAt }              (capped, most-recent-first)
 *   - logs        : { id, toolId, action, detail, ts }   (exportable "workflow log" for audit trails)
 *
 * This is intentionally dependency-free so it works before any CDN library
 * has loaded, and so the app shell itself is 100% offline-capable.
 */

const DB_NAME = 'offline-suite';
const DB_VERSION = 1;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('kv')) {
        db.createObjectStore('kv', { keyPath: 'key' });
      }
      if (!db.objectStoreNames.contains('favorites')) {
        db.createObjectStore('favorites', { keyPath: 'toolId' });
      }
      if (!db.objectStoreNames.contains('recents')) {
        db.createObjectStore('recents', { keyPath: 'toolId' });
      }
      if (!db.objectStoreNames.contains('logs')) {
        const store = db.createObjectStore('logs', { keyPath: 'id', autoIncrement: true });
        store.createIndex('ts', 'ts');
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

let dbPromise = null;
function getDB() {
  if (!dbPromise) dbPromise = openDB();
  return dbPromise;
}

async function tx(storeName, mode) {
  const db = await getDB();
  const t = db.transaction(storeName, mode);
  return { t, store: t.objectStore(storeName) };
}

const DB = {
  async get(key, fallback = null) {
    try {
      const { store } = await tx('kv', 'readonly');
      return await new Promise((resolve) => {
        const r = store.get(key);
        r.onsuccess = () => resolve(r.result ? r.result.value : fallback);
        r.onerror = () => resolve(fallback);
      });
    } catch { return fallback; }
  },

  async set(key, value) {
    const { store, t } = await tx('kv', 'readwrite');
    store.put({ key, value });
    return new Promise((resolve) => { t.oncomplete = () => resolve(true); t.onerror = () => resolve(false); });
  },

  async toggleFavorite(toolId) {
    const { store, t } = await tx('favorites', 'readwrite');
    const existing = await new Promise((res) => { const r = store.get(toolId); r.onsuccess = () => res(r.result); });
    if (existing) store.delete(toolId); else store.put({ toolId, addedAt: Date.now() });
    return new Promise((resolve) => { t.oncomplete = () => resolve(!existing); });
  },

  async getFavorites() {
    const { store } = await tx('favorites', 'readonly');
    return new Promise((resolve) => {
      const r = store.getAll();
      r.onsuccess = () => resolve((r.result || []).sort((a, b) => b.addedAt - a.addedAt).map(f => f.toolId));
      r.onerror = () => resolve([]);
    });
  },

  async pushRecent(toolId, cap = 10) {
    const { store, t } = await tx('recents', 'readwrite');
    store.put({ toolId, usedAt: Date.now() });
    await new Promise((resolve) => { t.oncomplete = resolve; });
    const all = await this.getRecents(50);
    if (all.length > cap) {
      const { store: s2, t: t2 } = await tx('recents', 'readwrite');
      all.slice(cap).forEach(id => s2.delete(id));
      await new Promise((resolve) => { t2.oncomplete = resolve; });
    }
  },

  async getRecents(limit = 10) {
    const { store } = await tx('recents', 'readonly');
    return new Promise((resolve) => {
      const r = store.getAll();
      r.onsuccess = () => resolve((r.result || []).sort((a, b) => b.usedAt - a.usedAt).slice(0, limit).map(x => x.toolId));
      r.onerror = () => resolve([]);
    });
  },

  async log(toolId, action, detail = '') {
    const { store, t } = await tx('logs', 'readwrite');
    store.add({ toolId, action, detail, ts: Date.now() });
    return new Promise((resolve) => { t.oncomplete = () => resolve(true); });
  },

  async exportLogs() {
    const { store } = await tx('logs', 'readonly');
    return new Promise((resolve) => {
      const r = store.getAll();
      r.onsuccess = () => resolve(r.result || []);
      r.onerror = () => resolve([]);
    });
  },

  // Most-recent-first activity feed for the dashboard's "Recent activity"
  // panel — same underlying store as exportLogs()/the audit trail, just
  // capped and sorted for quick display rather than a full export.
  async getRecentLogs(limit = 8) {
    const { store } = await tx('logs', 'readonly');
    return new Promise((resolve) => {
      const r = store.getAll();
      r.onsuccess = () => resolve((r.result || []).sort((a, b) => b.ts - a.ts).slice(0, limit));
      r.onerror = () => resolve([]);
    });
  },

  async clearLogs() {
    const { store, t } = await tx('logs', 'readwrite');
    store.clear();
    return new Promise((resolve) => { t.oncomplete = () => resolve(true); t.onerror = () => resolve(false); });
  },

  async clearRecents() {
    const { store, t } = await tx('recents', 'readwrite');
    store.clear();
    return new Promise((resolve) => { t.oncomplete = () => resolve(true); t.onerror = () => resolve(false); });
  },

  // Rough estimate of how much this app's own local storage is using —
  // shown in Settings so "everything stays on this device" isn't just a
  // claim, the user can actually see what that means in practice.
  async estimateStorageUsage() {
    try {
      if (navigator.storage && navigator.storage.estimate) {
        const { usage, quota } = await navigator.storage.estimate();
        return { usage: usage || 0, quota: quota || 0 };
      }
    } catch {}
    return { usage: null, quota: null };
  },
};
return DB;
})();


/* ===== js/router.js -> ROUTER ===== */

const ROUTER = (function() {

/**
 * router.js — minimal hash router. No SPA framework: routes are just
 * `#/tool/<id>`, `#/category/<id>`, or `#/` (dashboard). Kept tiny on
 * purpose so the whole shell loads and works with zero build step.
 */
function initRouter(onChange) {
  function parse() {
    const hash = location.hash.replace(/^#\/?/, '');
    const [kind, id] = hash.split('/');
    if (!kind) return { kind: 'dashboard' };
    return { kind, id };
  }
  window.addEventListener('hashchange', () => onChange(parse()));
  return {
    current: parse,
    go(path) { location.hash = path; },
  };
}
return { initRouter };
})();

function getTool(id) { return TOOLS.find(t => t.id === id); }
function toolsByCategory(catId) { return TOOLS.filter(t => t.category === catId); }

/* ------------------------------------------------------------- search ---- */
// Small synonym map so natural phrasing ("shrink pdf", "combine files",
// "photo to text") finds the right tool even when it doesn't share exact
// wording with the tool's name/description.
const SEARCH_SYNONYMS = {
  combine: 'merge', join: 'merge', concat: 'merge',
  shrink: 'compress', reduce: 'compress', optimize: 'compress', smaller: 'compress',
  picture: 'image', photo: 'image', pic: 'image',
  doc: 'word', docx: 'word',
  sheet: 'excel', xlsx: 'excel', spreadsheet: 'excel',
  slides: 'powerpoint', pptx: 'powerpoint', ppt: 'powerpoint', presentation: 'powerpoint',
  scan: 'ocr',
  unlock: 'password', lock: 'protect',
  qr: 'qr code'.split(' ')[0], // 'qr' already matches literally; kept for clarity
  uuid: 'guid',
  rename: 'batch',
};

function searchTools(query) {
  const q = query.trim().toLowerCase();
  if (!q) return [];
  // Generic filler words shouldn't force an exact-match requirement — "photo
  // to text" should still find "Image → Text" even though the tool's copy
  // never says the word "to".
  const STOPWORDS = new Set(['to', 'a', 'an', 'the', 'of', 'for', 'and', 'file', 'files', 'my', 'from', 'into']);
  const allWords = q.split(/\s+/).filter(Boolean);
  const words = allWords.filter((w) => !STOPWORDS.has(w));
  const effectiveWords = words.length ? words : allWords; // a query of only stopwords shouldn't match everything

  return TOOLS
    .map((t) => {
      const name = t.name.toLowerCase();
      const hay = `${name} ${t.desc.toLowerCase()} ${t.category}`;
      // Each query word must match directly OR via its synonym (not both) —
      // "shrink pdf" should find "Compress PDF" even though the literal
      // word "shrink" never appears anywhere in that tool's copy.
      const wordMatches = (w) => hay.includes(w) || (SEARCH_SYNONYMS[w] && hay.includes(SEARCH_SYNONYMS[w]));
      if (!effectiveWords.every(wordMatches)) return { tool: t, score: 0 };
      let score = 4;
      if (name === q) score += 20;
      else if (name.startsWith(q)) score += 12;
      else if (name.includes(q)) score += 8;
      if (allWords.every((w) => hay.includes(w))) score += 3; // literal (non-synonym) matches rank a little higher
      return { tool: t, score };
    })
    .filter((r) => r.score > 0)
    .sort((a, b) => b.score - a.score)
    .map((r) => r.tool);
}

/* ------------------------------------------------------- command palette */
function initCommandPalette(navigate) {
  let overlay = null;
  let previouslyFocused = null;

  function open() {
    if (overlay) return;
    previouslyFocused = document.activeElement;
    overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">
        <input class="palette-input" placeholder="Search 60+ tools… (merge pdf, resize image, json formatter)" aria-label="Search tools" autofocus>
        <div class="palette-results" role="listbox" aria-label="Search results"></div>
        <div class="palette-footer">
          <span><kbd>↑↓</kbd> navigate</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    const input = overlay.querySelector('.palette-input');
    const results = overlay.querySelector('.palette-results');
    let items = TOOLS.slice(0, 8);
    let activeIdx = 0;

    function draw() {
      results.innerHTML = items.map((t, i) => `
        <div class="palette-item ${i === activeIdx ? 'active' : ''}" data-idx="${i}" role="option" aria-selected="${i === activeIdx}">
          <span style="width:16px;flex:none">${icon(CATEGORIES.find(c => c.id === t.category)?.icon || 'file')}</span>
          <span>${t.name}</span><span class="p-desc">${t.desc}</span>
        </div>`).join('') || `<div class="empty-state" style="padding:24px"><div>No tools match</div></div>`;
    }
    draw();

    input.addEventListener('input', () => {
      items = input.value.trim() ? searchTools(input.value) : TOOLS.slice(0, 8);
      activeIdx = 0;
      draw();
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(items.length - 1, activeIdx + 1); draw(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(0, activeIdx - 1); draw(); }
      else if (e.key === 'Enter') { e.preventDefault(); if (items[activeIdx]) { close(); navigate(items[activeIdx].id); } }
      else if (e.key === 'Escape') { close(); }
      else if (e.key === 'Tab') { e.preventDefault(); } // only one focusable control in this dialog — keep focus trapped on it
    });
    results.addEventListener('click', (e) => {
      const row = e.target.closest('.palette-item');
      if (!row) return;
      close(); navigate(items[+row.dataset.idx].id);
    });
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
    setTimeout(() => input.focus(), 10);
  }

  function close() {
    if (!overlay || overlay.classList.contains('overlay-leaving')) return;
    // Same reverse-of-entrance treatment as the modal/toast fixes above —
    // this was the most-used overlay in the app (bound to the primary
    // Ctrl/Cmd+K shortcut) and had the identical instant-removal snap.
    const closingOverlay = overlay;
    closingOverlay.classList.add('overlay-leaving');
    if (previouslyFocused && document.contains(previouslyFocused)) previouslyFocused.focus();
    previouslyFocused = null;
    let removed = false;
    const doRemove = () => { if (!removed) { removed = true; closingOverlay.remove(); } };
    closingOverlay.addEventListener('animationend', doRemove, { once: true });
    setTimeout(doRemove, 180);
    overlay = null;
  }

  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); overlay ? close() : open(); }
  });

  return { open, close };
}
return { CATEGORIES, TOOLS, getTool, toolsByCategory, searchTools, initCommandPalette };
})();


/* ===== js/batch.js -> BATCH ===== */

const BATCH = (function() {
const icon = UI.icon;
const formatBytes = UI.formatBytes;
const downloadBlob = UI.downloadBlob;
const toast = UI.toast;
const escapeHtml = UI.escapeHtml;
/**
 * batch.js — generic batch-processing engine.
 *
 * Every module (PDF, Image, OCR, Office) hands this a list of "jobs":
 *   { id, label, run: async (onProgress) => Blob|File }
 * and gets back per-job progress, cancellation, retry, and a final
 * downloadable ZIP of all results (via JSZip, loaded lazily).
 *
 * This is the "Batch Processing Engine" + "Folder processing" backbone
 * referenced across the PDF/Image/OCR/Office/Enterprise sections of the
 * spec — implemented once, reused everywhere, instead of bespoke batch
 * logic per tool.
 */



const CONCURRENCY = 3;

class BatchRunner {
  /**
   * @param {Array<{id:string,label:string,run:(onProgress:(pct:number)=>void)=>Promise<Blob>}>} jobs
   * @param {{toolId:string, zipName?:string}} opts
   */
  constructor(jobs, opts = {}) {
    this.jobs = jobs.map(j => ({ ...j, status: 'queued', pct: 0, result: null, error: null }));
    this.opts = opts;
    this.cancelled = false;
    this.listeners = [];
  }

  onUpdate(fn) { this.listeners.push(fn); }
  _emit() { this.listeners.forEach(fn => fn(this.jobs)); }

  cancel() { this.cancelled = true; }

  async runAll() {
    let cursor = 0;
    const workers = new Array(Math.min(CONCURRENCY, this.jobs.length)).fill(0).map(() => this._worker(() => cursor++));
    await Promise.all(workers);
    await DB.log(this.opts.toolId || 'batch', 'batch-complete', `${this.jobs.filter(j => j.status === 'done').length}/${this.jobs.length} succeeded`);
    return this.jobs;
  }

  async _worker(nextIndex) {
    while (!this.cancelled) {
      const i = nextIndex();
      if (i >= this.jobs.length) return;
      const job = this.jobs[i];
      job.status = 'running';
      this._emit();
      try {
        job.result = await job.run((pct) => { job.pct = pct; this._emit(); });
        job.status = 'done';
        job.pct = 100;
      } catch (err) {
        job.status = 'error';
        job.error = err?.message || String(err);
      }
      this._emit();
    }
  }

  async downloadZip(zipName = 'batch-output.zip') {
    const succeeded = this.jobs.filter(j => j.status === 'done' && j.result);
    if (!succeeded.length) { toast('No successful results to download', 'error'); return; }
    if (succeeded.length === 1) {
      downloadBlob(succeeded[0].result, succeeded[0].label);
      return;
    }
    const zip = new window.JSZip();
    // Guard against duplicate output filenames (e.g. two dropped files that
    // both happened to be named "photo.jpg" from different folders) — without
    // this, JSZip would silently let the second entry overwrite the first
    // and one result would vanish from the download with no warning.
    const seenNames = new Map();
    succeeded.forEach(j => {
      let name = j.label;
      if (seenNames.has(name)) {
        const n = seenNames.get(name) + 1;
        seenNames.set(name, n);
        const dot = name.lastIndexOf('.');
        name = dot > 0 ? `${name.slice(0, dot)} (${n})${name.slice(dot)}` : `${name} (${n})`;
      } else {
        seenNames.set(name, 1);
      }
      zip.file(name, j.result);
    });
    const blob = await zip.generateAsync({ type: 'blob' });
    downloadBlob(blob, zipName);
  }
}

/**
 * Renders a live batch queue UI into `container` and executes on "Start".
 * Returns the BatchRunner instance so callers can inspect final results
 * (e.g. to chain into another tool).
 */
function renderBatchQueue(container, jobs, { toolId, zipName, title = 'Batch queue', autoRun = true, autoDownloadSingle = true, onComplete } = {}) {
  const runner = new BatchRunner(jobs, { toolId });
  const wrap = document.createElement('div');
  wrap.className = 'card stack-8';
  wrap.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px">
      <strong style="font-size:13.5px">${title}</strong>
      <span class="text-tertiary text-sm" data-role="status">${jobs.length} file${jobs.length === 1 ? '' : 's'} · starting…</span>
      <div style="margin-left:auto;display:flex;gap:8px">
        <button class="btn sm ghost" data-act="cancel">Cancel</button>
        <button class="btn sm ghost" data-act="rerun" style="display:none">${icon('batch')} Run again</button>
        <button class="btn sm primary" data-act="dl" disabled>${icon('download')} Download all</button>
      </div>
    </div>
    <div class="file-list" data-role="list"></div>`;
  container.appendChild(wrap);

  const list = wrap.querySelector('[data-role=list]');
  const statusEl = wrap.querySelector('[data-role=status]');
  const dlBtn = wrap.querySelector('[data-act=dl]');
  const rerunBtn = wrap.querySelector('[data-act=rerun]');

  function draw() {
    list.innerHTML = '';
    runner.jobs.forEach(j => {
      const row = document.createElement('div');
      row.className = 'file-chip';
      const statusColor = j.status === 'done' ? 'var(--success)' : j.status === 'error' ? 'var(--danger)' : 'var(--text-tertiary)';
      let sizeInfo = '';
      if (j.status === 'done' && j.result && j.originalSize != null) {
        const before = j.originalSize, after = j.result.size;
        const pct = before > 0 ? Math.round((1 - after / before) * 100) : 0;
        const trend = pct > 0 ? `${pct}% smaller` : pct < 0 ? `${Math.abs(pct)}% larger` : 'same size';
        sizeInfo = `<div class="text-sm text-tertiary" style="margin-top:2px">${formatBytes(before)} → ${formatBytes(after)} (${trend})</div>`;
      }
      // Status indicator: icon + word + tooltip, not just a bare colored
      // word — a color with no label or explanation is easy to misread as
      // an unrelated "colour section" rather than a processing status.
      const statusMeta = {
        error: { label: 'Failed', title: 'This file could not be converted — see the error message above.', icon: '✕' },
        done: { label: 'Done', title: 'Finished — ready to download.', icon: '✓' },
        running: { label: `${j.pct}%`, title: 'Currently processing…', icon: '' },
        queued: { label: 'Queued', title: 'Waiting for its turn to process.', icon: '' },
      }[j.status] || { label: 'Queued', title: 'Waiting for its turn to process.', icon: '' };
      row.innerHTML = `
        <div class="file-icon">${icon('file')}</div>
        <div style="flex:1;min-width:0">
          <div class="file-name">${escapeHtml(j.label)}</div>
          <div class="progress-track" style="margin-top:4px"><div class="progress-fill" style="width:${j.pct}%"></div></div>
          ${j.status === 'error' ? `<div class="text-sm" style="color:var(--danger);margin-top:2px">${escapeHtml(j.error || 'Failed')}</div>` : sizeInfo}
        </div>
        <div class="file-meta" style="color:${statusColor};min-width:70px;text-align:right" title="${escapeHtml(statusMeta.title)}">${statusMeta.icon ? statusMeta.icon + ' ' : ''}${statusMeta.label}</div>`;
      list.appendChild(row);
    });
  }
  draw();
  runner.onUpdate(draw);

  async function runNow() {
    rerunBtn.style.display = 'none';
    dlBtn.disabled = true;
    statusEl.textContent = `${jobs.length} file${jobs.length === 1 ? '' : 's'} · processing…`;
    await runner.runAll();
    const okCount = runner.jobs.filter(j => j.status === 'done').length;
    statusEl.textContent = `${okCount}/${jobs.length} succeeded`;
    toast(`${title}: ${okCount}/${jobs.length} succeeded`, okCount === jobs.length ? 'success' : okCount === 0 ? 'error' : 'warn');
    dlBtn.disabled = okCount === 0;
    if (okCount > 0 && jobs.length > 1) rerunBtn.style.display = '';
    // The whole point of "batch processing" here is one click in -> a file
    // out. For the common single-file case, download immediately instead
    // of making the person hunt for a second button.
    if (autoDownloadSingle && okCount === 1 && jobs.length === 1) {
      await runner.downloadZip(zipName);
    }
    // Lets callers release resources (e.g. terminate OCR workers) once every
    // job has settled, without them needing to poll or duplicate the wait
    // logic themselves.
    if (onComplete) { try { await onComplete(runner.jobs); } catch { /* cleanup errors shouldn't surface as a batch failure */ } }
  }

  rerunBtn.addEventListener('click', runNow);
  wrap.querySelector('[data-act=cancel]').addEventListener('click', () => { runner.cancel(); statusEl.textContent = 'Cancelled'; toast('Batch cancelled', 'warn'); });
  dlBtn.addEventListener('click', () => runner.downloadZip(zipName));

  if (autoRun) runNow();
  return runner;
}
return { BatchRunner, renderBatchQueue };
})();


/* ===== js/modules/dashboard.js -> MOD_DASHBOARD ===== */

const MOD_DASHBOARD = (function() {
const icon = UI.icon;
const formatRelativeTime = UI.formatRelativeTime;
const TOOLS = SEARCH.TOOLS;
const CATEGORIES = SEARCH.CATEGORIES;
const getTool = SEARCH.getTool;
function toolCard(tool, favorites, onOpen, onFav) {
  const card = document.createElement('div');
  card.className = 'tool-card';
  card.setAttribute('role', 'button');
  card.setAttribute('tabindex', '0');
  const isFav = favorites.includes(tool.id);
  card.setAttribute('aria-label', `${tool.name}${isFav ? ', favorited' : ''}. ${tool.desc}`);
  card.innerHTML = `
    <div class="tool-card-top">
      <div class="tool-icon">${icon(CATEGORIES.find(c => c.id === tool.category)?.icon || 'file')}</div>
      <button class="fav-btn ${isFav ? 'active' : ''}" data-fav aria-label="${isFav ? 'Remove from' : 'Add to'} favorites: ${tool.name}" title="Toggle favorite">${icon('star')}</button>
    </div>
    <div class="tool-name">${tool.name}${!tool.implemented ? ' <span class="badge beta" style="margin-left:4px">Roadmap</span>' : ''}</div>
    <div class="tool-desc">${tool.desc}</div>`;
  card.addEventListener('click', (e) => { if (e.target.closest('[data-fav]')) return; onOpen(tool.id); });
  card.addEventListener('keydown', (e) => {
    if (e.target.closest('[data-fav]')) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onOpen(tool.id); }
  });
  card.querySelector('[data-fav]').addEventListener('click', (e) => { e.stopPropagation(); onFav(tool.id, card); });
  return card;
}

// Human-readable one-liner for a logged conversion event, e.g.
// "Merge PDF — 2 files" rather than raw {action:'merge', detail:'3 files'}.
function describeLogEntry(entry) {
  const t = getTool(entry.toolId);
  const name = t ? t.name : entry.toolId;
  const detail = entry.detail || entry.action.replace(/-/g, ' ').replace(/^\w/, (c) => c.toUpperCase());
  return { name, detail };
}

function activityRow(entry) {
  const t = getTool(entry.toolId);
  const { name, detail } = describeLogEntry(entry);
  const row = document.createElement('div');
  row.className = 'file-chip';
  row.style.cursor = t ? 'pointer' : 'default';
  row.innerHTML = `
    <span style="width:16px;flex:none;color:var(--accent)">${icon(t ? (CATEGORIES.find(c => c.id === t.category)?.icon || 'file') : 'file')}</span>
    <span><strong>${name}</strong> — ${detail}</span>
    <span class="file-meta" style="margin-left:auto;flex:none">${formatRelativeTime(entry.ts)}</span>`;
  if (t) row.addEventListener('click', () => { location.hash = `/tool/${t.id}`; });
  return row;
}

async function renderDashboard(container, navigate) {
  const favorites = await DB.getFavorites();
  const recentIds = await DB.getRecents(6);
  const recents = recentIds.map(getTool).filter(Boolean);
  const favTools = favorites.map(getTool).filter(Boolean);
  const activity = (await DB.getRecentLogs(20)).filter(e => e.action !== 'open').slice(0, 6);

  const wrap = document.createElement('div');
  wrap.className = 'main-inner';
  wrap.innerHTML = `
    <div class="page-header">
      <div class="page-eyebrow">Offline Workspace</div>
      <h1 class="page-title">Everything runs on this device.</h1>
      <p class="page-sub">${TOOLS.length}+ tools across PDF, image, OCR, office, developer and security workflows — no upload, no account, no server round-trip.</p>
    </div>
    <div class="grid cols-4" data-role="quick"></div>
  `;
  container.appendChild(wrap);

  const quick = wrap.querySelector('[data-role=quick]');
  ['pdf-merge', 'img-compress', 'ocr-image', 'word-pdf'].forEach(id => {

    if (t) quick.appendChild(toolCard(t, favorites, navigate, refreshFav));
  });

  if (activity.length) {
    const section = document.createElement('div');
    section.className = 'mt-16';
    section.innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between;margin:24px 0 10px"><h2 style="font-size:15px;margin:0">Recent activity</h2><button class="btn ghost sm" data-role="clear-activity">Clear</button></div>`;
    const list = document.createElement('div');
    list.className = 'file-list';
    activity.forEach(entry => list.appendChild(activityRow(entry)));
    section.appendChild(list);
    wrap.appendChild(section);
    section.querySelector('[data-role=clear-activity]').addEventListener('click', async () => {
      await DB.clearLogs();
      section.remove();
      UI.toast('Activity history cleared', 'success');
    });
  }

  if (favTools.length) {
    const section = document.createElement('div');
    section.className = 'mt-16';
    section.innerHTML = `<h2 style="font-size:15px;margin:24px 0 10px">Favorites</h2>`;
    const grid = document.createElement('div');
    grid.className = 'grid cols-4';
    favTools.forEach(t => grid.appendChild(toolCard(t, favorites, navigate, refreshFav)));
    section.appendChild(grid);
    wrap.appendChild(section);
  }

  if (recents.length) {
    const section = document.createElement('div');
    section.innerHTML = `<h2 style="font-size:15px;margin:24px 0 10px">Recently used</h2>`;
    const grid = document.createElement('div');
    grid.className = 'grid cols-4';
    recents.forEach(t => grid.appendChild(toolCard(t, favorites, navigate, refreshFav)));
    section.appendChild(grid);
    wrap.appendChild(section);
  }

  CATEGORIES.forEach(cat => {
    const tools = TOOLS.filter(t => t.category === cat.id);
    const section = document.createElement('div');
    section.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;margin:28px 0 10px">
        <div style="width:22px;color:var(--accent)">${icon(cat.icon)}</div>
        <h2 style="font-size:15px">${cat.label}</h2>
        <span class="text-tertiary text-sm">${tools.length} tools</span>
      </div>`;
    const grid = document.createElement('div');
    grid.className = 'grid cols-4';
    tools.forEach(t => grid.appendChild(toolCard(t, favorites, navigate, refreshFav)));
    section.appendChild(grid);
    wrap.appendChild(section);
  });

  async function refreshFav(toolId, cardEl) {
    const nowFav = await DB.toggleFavorite(toolId);
    cardEl.querySelector('[data-fav]').classList.toggle('active', nowFav);
  }
}
return { renderDashboard };
})();


/* ===== js/modules/pdf.js -> MOD_PDF ===== */

const MOD_PDF = (function() {
const icon = UI.icon;
const iconEl = UI.iconEl;
const toast = UI.toast;
const makeDropzone = UI.makeDropzone;
const makeFileListPanel = UI.makeFileListPanel;
const makeStagedFileTool = UI.makeStagedFileTool;
const makeProgress = UI.makeProgress;
const downloadBlob = UI.downloadBlob;
